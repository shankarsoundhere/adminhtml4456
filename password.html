<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Common Delete Password</title><style>body{font-family:Arial;background:#f3f4f6;margin:0;padding:20px}.box{max-width:420px;margin:40px auto;background:white;padding:20px;border-radius:14px;box-shadow:0 3px 15px #0002}h2{text-align:center;color:#0d6efd}input,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box;font-size:16px}button{background:#0d6efd;color:white;border:0;border-radius:8px}#msg{text-align:center}</style></head><body><div class="box"><h2>🔐 Common Delete Password</h2><input id="old" type="password" placeholder="पुराना Password (पहली बार खाली छोड़ें)"><input id="new" type="password" placeholder="नया Password"><input id="confirm" type="password" placeholder="नया Password फिर लिखें"><button id="save">Password बदलें / सेट करें</button><p id="msg"></p></div><script type="module">import{db,doc,getDoc,setDoc}from'./firebase.js';const $=id=>document.getElementById(id);$('save').onclick=async()=>{let old=$('old').value,n=$('new').value,c=$('confirm').value;if(!n){$('msg').textContent='नया Password लिखें';return}if(n!==c){$('msg').textContent='दोनों Password मेल नहीं खाते';return}try{let r=doc(db,'security','config'),s=await getDoc(r);if(s.exists()&&String(s.data().deletePassword||'')!==old){$('msg').textContent='पुराना Password गलत';return}await setDoc(r,{deletePassword:n});$('msg').textContent='Password सेट/बदल गया ✓';$('old').value=$('new').value=$('confirm').value=''}catch(e){$('msg').textContent='Error: '+e.message}};</script></body></html>
