<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delete Password Settings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #ffffff;
      color: #111827;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f3f4f6;
    }
    .top-bar h2 {
      font-size: 18px;
      color: #111827;
    }
    .back-btn {
      text-decoration: none;
      background: #f3f4f6;
      color: #1f2937;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid #d1d5db;
    }
    .status-box {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      color: #374151;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #374151;
    }
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 11px 12px;
      font-size: 15px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      background: #ffffff;
    }
    input:focus {
      border-color: #2563eb;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      color: #4b5563;
      cursor: pointer;
    }
    .btn {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: #111827;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .msg {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .msg.success {
      display: block;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .msg.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <h2>🔐 Delete Password</h2>
      <a href="index.html" class="back-btn">← Dashboard</a>
    </div>

    <div id="statusBox" class="status-box">
      स्थिति जाँची जा रही है...
    </div>

    <form id="passwordForm">
      <div class="form-group" id="oldPassGroup" style="display: none;">
        <label for="oldPassword">पुराना पासवर्ड (Current Password)</label>
        <input type="password" id="oldPassword" placeholder="वर्तमान पासवर्ड डालें" autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="newPassword">नया पासवर्ड (New Delete Password)</label>
        <input type="password" id="newPassword" placeholder="नया पासवर्ड डालें" required autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="confirmPassword">पासवर्ड की पुष्टि करें (Confirm Password)</label>
        <input type="password" id="confirmPassword" placeholder="नया पासवर्ड दोबारा डालें" required autocomplete="off" />
      </div>

      <label class="toggle-row">
        <input type="checkbox" id="showPassCheck" />
        पासवर्ड दिखाएं (Show Password)
      </label>

      <button type="submit" class="btn" id="saveBtn" disabled>प्रतीक्षा करें...</button>
    </form>

    <div id="msgBox" class="msg"></div>
  </div>

  <script type="module">
    import { db, doc, getDoc, setDoc } from "./firebase.js";

    const configRef = doc(db, "security", "config");
    const statusBox = document.getElementById("statusBox");
    const oldPassGroup = document.getElementById("oldPassGroup");
    const oldPasswordInput = document.getElementById("oldPassword");
    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const showPassCheck = document.getElementById("showPassCheck");
    const saveBtn = document.getElementById("saveBtn");
    const msgBox = document.getElementById("msgBox");
    const passwordForm = document.getElementById("passwordForm");

    let existingPassword = null;

    function showMessage(text, type) {
      msgBox.textContent = text;
      msgBox.className = "msg " + type;
    }

    showPassCheck.addEventListener("change", () => {
      const type = showPassCheck.checked ? "text" : "password";
      oldPasswordInput.type = type;
      newPasswordInput.type = type;
      confirmPasswordInput.type = type;
    });

    async function loadCurrentConfig() {
      try {
        const snap = await getDoc(configRef);
        if (snap.exists() && snap.data().deletePassword) {
          existingPassword = String(snap.data().deletePassword);
          statusBox.innerHTML = "स्थिति: <strong>पासवर्ड पहले से सेट है।</strong> बदलने के लिए पुराना पासवर्ड डालें।";
          oldPassGroup.style.display = "block";
          oldPasswordInput.required = true;
          saveBtn.textContent = "पासवर्ड अपडेट करें";
        } else {
          existingPassword = null;
          statusBox.innerHTML = "स्थिति: <strong>अभी कोई पासवर्ड सेट नहीं है।</strong> नया पासवर्ड बनाएं।";
          oldPassGroup.style.display = "none";
          oldPasswordInput.required = false;
          saveBtn.textContent = "नया पासवर्ड सेव करें";
        }
        saveBtn.disabled = false;
      } catch (err) {
        console.error(err);
        statusBox.textContent = "डेटा लोड करने में त्रुटि हुई। इंटरनेट या Firebase Rules जांचें।";
      }
    }

    passwordForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      msgBox.className = "msg";

      const oldVal = oldPasswordInput.value.trim();
      const newVal = newPasswordInput.value.trim();
      const confirmVal = confirmPasswordInput.value.trim();

      if (existingPassword !== null && oldVal !== existingPassword) {
        showMessage("❌ पुराना पासवर्ड गलत है!", "error");
        return;
      }

      if (newVal.length < 4) {
        showMessage("❌ नया पासवर्ड कम से कम 4 अक्षरों या अंकों का होना चाहिए।", "error");
        return;
      }

      if (newVal !== confirmVal) {
        showMessage("❌ दोनों नए पासवर्ड मेल नहीं खा रहे हैं!", "error");
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "सेव हो रहा है...";

      try {
        await setDoc(configRef, { deletePassword: newVal }, { merge: true });
        existingPassword = newVal;
        oldPasswordInput.value = "";
        newPasswordInput.value = "";
        confirmPasswordInput.value = "";
        oldPassGroup.style.display = "block";
        oldPasswordInput.required = true;
        statusBox.innerHTML = "स्थिति: <strong>पासवर्ड अपडेट हो चुका है।</strong>";
        showMessage("✅ Common Delete Password सफलतापूर्वक सेव हो गया है!", "success");
      } catch (err) {
        console.error(err);
        showMessage("❌ पासवर्ड सेव करने में त्रुटि हुई: " + err.message, "error");
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "पासवर्ड अपडेट करें";
      }
    });

    loadCurrentConfig();
  </script>
</body>
</html>
