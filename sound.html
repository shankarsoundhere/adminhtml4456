<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Main List Admin Panel</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#28a745">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
body{font-family:Arial;background:#f1f3f6;padding:10px;}

.box{max-width:1000px;margin:auto;background:white;padding:15px;border-radius:10px;}

input,button{width:100%;padding:10px;margin:5px 0;box-sizing:border-box;font-size:16px;}
button{background:#28a745;color:white;border:none;border-radius:5px;cursor:pointer;}

.dateWrap{position:relative;}
.datePicker{
position:absolute;
left:0;
top:5px;
width:100%;
height:42px;
opacity:0;
z-index:2;
cursor:pointer;
}

table{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:10px;}

th,td{
border:1px solid #000;
padding:7px 4px;
text-align:center;
font-size:13px;
word-break:break-word;
}

th{background:#4facfe;color:white;}

th:nth-child(1),td:nth-child(1){width:22%;}
th:nth-child(2),td:nth-child(2){width:28%;}
th:nth-child(3),td:nth-child(3){width:30%;}
th:nth-child(4),td:nth-child(4){width:20%;}

tr{cursor:pointer;}
tr:hover{background:#eee;}

.actionBtn{
padding:5px 7px;
font-size:12px;
margin:2px;
width:auto;
}

.popup{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.5);
justify-content:center;
align-items:center;
z-index:999;
}

.popup-box{
background:white;
padding:15px;
border-radius:10px;
width:90%;
max-width:450px;
}

.redBtn{background:red;}
.blueBtn{background:#007bff;}

/* PRINT */
@media print{
input,button,.actionBtn,.popup,h2,.datePicker{display:none !important;}

body{background:white;margin:0;padding:0;}

.box{max-width:100%;margin:0;padding:0;}

table{width:100%;border-collapse:collapse;}

th,td{
border:1px solid #ddd;
padding:6px;
font-size:14px;
}

th:nth-child(4),
td:nth-child(4){
display:none;
}
}
</style>
</head>

<body>

<div class="box">

<h2>Sound System</h2>

<div class="dateWrap">
<input id="date" placeholder="दिनांक" readonly>
<input id="datePicker" class="datePicker" type="date">
</div>

<input id="work" placeholder="काम">
<input id="place" placeholder="कहां जाएगा">
<input id="link" placeholder="Google Drive Link">

<button id="saveBtn" onclick="saveData()">💾 Save</button>
<button onclick="printData()">🖨️ Print</button>

<table>
<thead>
<tr>
<th>दिनांक</th>
<th>काम</th>
<th>कहां जाएगा</th>
<th>Action</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>

<div class="popup" id="editPopup">
<div class="popup-box">

<h3>Edit</h3>

<div class="dateWrap">
<input id="e_date" placeholder="दिनांक" readonly>
<input id="e_datePicker" class="datePicker" type="date">
</div>

<input id="e_work" placeholder="काम">
<input id="e_place" placeholder="कहां जाएगा">
<input id="e_link" placeholder="Google Drive Link">

<button id="updateBtn" onclick="updateData()">Update</button>
<button class="redBtn" onclick="closePopup()">Cancel</button>

</div>
</div>

<div class="popup" id="deletePopup">
<div class="popup-box">

<h3>Delete करना है?</h3>
<p>क्या आप इस data को delete करना चाहते हैं?</p>

<button class="redBtn" onclick="confirmDelete()">🗑️ Delete</button>
<button class="blueBtn" onclick="closeDeletePopup()">Cancel</button>

</div>
</div>

<script type="module">

import {
db,
collection,
addDoc,
onSnapshot,
deleteDoc,
doc,
updateDoc,
getDoc
} from "./firebase.js";

const colRef = collection(db,"main_list");

let editId=null;
let deleteId=null;

const $ = (id)=>document.getElementById(id);

function isoToDDMMYYYY(iso){
if(!iso) return "";
let p=iso.split("-");
return p[2]+"-"+p[1]+"-"+p[0];
}

function ddmmyyyyToISO(dateStr){
if(!dateStr) return "";
let p=dateStr.split("-");
if(p.length!==3) return "";
return p[2]+"-"+p[1].padStart(2,"0")+"-"+p[0].padStart(2,"0");
}

$("datePicker").addEventListener("change",function(){
$("date").value=isoToDDMMYYYY(this.value);
});

$("e_datePicker").addEventListener("change",function(){
$("e_date").value=isoToDDMMYYYY(this.value);
});

function buttonText(btnId,newText,oldText){
$(btnId).innerText=newText;
setTimeout(()=>{
$(btnId).innerText=oldText;
},1200);
}

function clearForm(){
["date","datePicker","work","place","link"].forEach(id=>$(id).value="");
}

function getSortDate(date){
let p=(date||"").split("-");
if(p.length!==3) return 99999999;

let dd=p[0].padStart(2,"0");
let mm=p[1].padStart(2,"0");
let yy=p[2];

if(yy.length===2){
yy="20"+yy;
}

return Number(yy+mm+dd);
}

window.saveData=async()=>{
let data={
date:$("date").value.trim(),
work:$("work").value.trim(),
place:$("place").value.trim(),
link:$("link").value.trim(),
time:Date.now()
};

if(!data.date && !data.work && !data.place){
buttonText("saveBtn","डाटा डालो","💾 Save");
return;
}

await addDoc(colRef,data);

clearForm();
buttonText("saveBtn","✅ Saved","💾 Save");
}

onSnapshot(colRef,snap=>{

let arr=[];

snap.forEach(d=>{
let x=d.data();

arr.push({
id:d.id,
date:x.date||"",
work:x.work||"",
place:x.place||"",
link:x.link||"",
time:x.time||0,
sort:getSortDate(x.date)
});
});

arr.sort((a,b)=>{
if(a.sort===b.sort){
return a.time-b.time;
}
return a.sort-b.sort;
});

let html="";

arr.forEach(x=>{
html+=`
<tr onclick="openLink('${x.link||""}')">
<td>${x.date}</td>
<td>${x.work}</td>
<td>${x.place}</td>
<td>
<button class="actionBtn" onclick="event.stopPropagation(); editData('${x.id}')">✏️</button>
<button class="actionBtn" onclick="event.stopPropagation(); openDeletePopup('${x.id}')">🗑️</button>
</td>
</tr>`;
});

$("tbody").innerHTML=html;

});

window.openLink=(l)=>{
if(l) window.open(l,"_blank");
}

window.openDeletePopup=(id)=>{
deleteId=id;
$("deletePopup").style.display="flex";
}

window.closeDeletePopup=()=>{
deleteId=null;
$("deletePopup").style.display="none";
}

window.confirmDelete=async()=>{
if(!deleteId) return;

await deleteDoc(doc(db,"main_list",deleteId));

deleteId=null;
$("deletePopup").style.display="none";
}

window.editData=async(id)=>{
let snap = await getDoc(doc(db,"main_list",id));

if(!snap.exists()){
return;
}

let x=snap.data();

$("e_date").value=x.date||"";
$("e_datePicker").value=ddmmyyyyToISO(x.date||"");
$("e_work").value=x.work||"";
$("e_place").value=x.place||"";
$("e_link").value=x.link||"";

editId=id;
$("editPopup").style.display="flex";
}

window.updateData=async()=>{
if(!editId){
buttonText("updateBtn","पहले Edit चुनो","Update");
return;
}

await updateDoc(doc(db,"main_list",editId),{
date:$("e_date").value.trim(),
work:$("e_work").value.trim(),
place:$("e_place").value.trim(),
link:$("e_link").value.trim()
});

buttonText("updateBtn","Updated","Update");

setTimeout(()=>{
$("editPopup").style.display="none";
editId=null;
},500);
}

window.closePopup=()=>{
$("editPopup").style.display="none";
editId=null;
}

window.printData=()=>window.print();

</script>

<script src="pwa.js"></script>

</body>
</html>
