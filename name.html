<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>नाम बदलें</title>

<style>
body{
    margin:0;
    padding:10px;
    font-family:Arial,sans-serif;
    background:#f1f3f6;
}

.box{
    max-width:700px;
    margin:auto;
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

h2{
    text-align:center;
    margin-top:5px;
    margin-bottom:20px;
}

.section-title{
    background:#28a745;
    color:white;
    padding:12px;
    border-radius:7px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin:20px 0 12px;
}

.pandal-title{
    background:#007bff;
}

.row{
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    margin-bottom:10px;
    background:#fafafa;
}

.slot{
    font-weight:bold;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:10px;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
    margin-bottom:8px;
}

button{
    padding:9px 12px;
    margin-right:5px;
    border:none;
    border-radius:5px;
    color:white;
    cursor:pointer;
    font-size:14px;
}

.editBtn{
    background:#007bff;
}

.saveBtn{
    background:#28a745;
}

.deleteBtn{
    background:#dc3545;
}

button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

#status{
    text-align:center;
    margin-bottom:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<h2>✏️ नाम बदलें</h2>

<div id="status">
Firebase से नाम लोड हो रहे हैं...
</div>


<!-- =========================
     LIGHT MISTRY
========================= -->

<div class="section-title">
💡 लाइट मिस्त्री
</div>

<div id="lightList"></div>


<!-- =========================
     PANDAL MISTRY
========================= -->

<div class="section-title pandal-title">
🏠 पंडाल मिस्त्री
</div>

<div id="pandalList"></div>

</div>


<script type="module">

import {
    db,
    collection,
    onSnapshot,
    doc,
    updateDoc,
    deleteDoc,
    getDoc
} from "./firebase.js";


const status =
    document.getElementById("status");


/* =========================
   DEFAULT NAMES
========================= */

const lightDefaultNames = {

    1:"राकेश मिस्त्री",
    2:"नुनु",
    3:"लक्की",
    4:"गुल्ला",
    5:"बब्लू ड्राइवर",
    6:"गोपी मिस्त्री",
    7:"सूरज जी",
    8:"बैला",
    9:"Slot 9",
    10:"Slot 10"

};


const pandalDefaultNames = {

    1:"पंडाल Slot 1",
    2:"पंडाल Slot 2",
    3:"पंडाल Slot 3",
    4:"पंडाल Slot 4",
    5:"पंडाल Slot 5",
    6:"पंडाल Slot 6",
    7:"पंडाल Slot 7",
    8:"पंडाल Slot 8",
    9:"पंडाल Slot 9",
    10:"पंडाल Slot 10"

};


/* =========================
   HTML SAFE
========================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   ROWS CREATE
========================= */

function createRows(
    container,
    type,
    defaultNames,
    firebaseData
){

    container.innerHTML = "";


    for(
        let slot = 1;
        slot <= 10;
        slot++
    ){

        let firebaseName = "";


        if(
            firebaseData[slot] &&
            firebaseData[slot].name
        ){

            firebaseName =
                firebaseData[slot].name;

        }else{

            firebaseName =
                defaultNames[slot];

        }


        const row =
            document.createElement("div");

        row.className = "row";


        row.innerHTML = `

        <div class="slot">
            ${type === "light" ? "💡" : "🏠"}
            Slot ${slot}
        </div>

        <input
            id="${type}-name-${slot}"
            type="text"
            value="${escapeHTML(firebaseName)}"
            disabled
        >

        <button
            class="editBtn"
            id="${type}-edit-${slot}"
            onclick="editName('${type}',${slot})"
        >
            ✏️ Edit
        </button>

        <button
            class="saveBtn"
            id="${type}-save-${slot}"
            onclick="saveName('${type}',${slot})"
            disabled
        >
            💾 Save
        </button>

        <button
            class="deleteBtn"
            onclick="deleteName('${type}',${slot})"
        >
            🗑️ Delete
        </button>

        `;


        container.appendChild(row);

    }

}


/* =========================
   LOAD LIGHT NAMES
========================= */

onSnapshot(

    collection(db,"light_names"),

    (snapshot)=>{

        const data = {};


        snapshot.forEach(item=>{

            const slot =
                Number(item.id);


            if(
                slot >= 1 &&
                slot <= 10
            ){

                data[slot] =
                    item.data();

            }

        });


        createRows(
            document.getElementById("lightList"),
            "light",
            lightDefaultNames,
            data
        );


        status.innerText =
            "नाम Firebase से लोड हो गए";

        status.style.color =
            "green";

    },

    (error)=>{

        console.error(
            "Light Firebase Error:",
            error
        );

        status.innerText =
            "Firebase Error: Light Names";

        status.style.color =
            "red";

    }

);


/* =========================
   LOAD PANDAL NAMES
========================= */

onSnapshot(

    collection(db,"pandal_names"),

    (snapshot)=>{

        const data = {};


        snapshot.forEach(item=>{

            const slot =
                Number(item.id);


            if(
                slot >= 1 &&
                slot <= 10
            ){

                data[slot] =
                    item.data();

            }

        });


        createRows(
            document.getElementById("pandalList"),
            "pandal",
            pandalDefaultNames,
            data
        );


        status.innerText =
            "Light और Pandal नाम तैयार हैं";

        status.style.color =
            "green";

    },

    (error)=>{

        console.error(
            "Pandal Firebase Error:",
            error
        );

        status.innerText =
            "Firebase Error: Pandal Names";

        status.style.color =
            "red";

    }

);


/* =========================
   EDIT
========================= */

window.editName =
function(type,slot){

    const input =
        document.getElementById(
            type+"-name-"+slot
        );


    const editBtn =
        document.getElementById(
            type+"-edit-"+slot
        );


    const saveBtn =
        document.getElementById(
            type+"-save-"+slot
        );


    input.disabled = false;

    input.focus();

    editBtn.disabled = true;

    saveBtn.disabled = false;

};


/* =========================
   SAVE
========================= */

window.saveName =
async function(type,slot){

    const input =
        document.getElementById(
            type+"-name-"+slot
        );


    const name =
        input.value.trim();


    if(name === ""){

        alert(
            "नाम खाली नहीं हो सकता।"
        );

        return;

    }


    const collectionName =
        type === "light"
        ? "light_names"
        : "pandal_names";


    try{

        const nameRef =
            doc(
                db,
                collectionName,
                String(slot)
            );


        const oldData =
            await getDoc(nameRef);


        if(oldData.exists()){

            await updateDoc(
                nameRef,
                {
                    name:name,
                    slot:slot,
                    time:Date.now()
                }
            );

        }else{

            const {setDoc} =
                await import(
                    "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"
                );


            await setDoc(
                nameRef,
                {
                    name:name,
                    slot:slot,
                    time:Date.now()
                }
            );

        }


        input.disabled = true;


        document.getElementById(
            type+"-edit-"+slot
        ).disabled = false;


        document.getElementById(
            type+"-save-"+slot
        ).disabled = true;


        status.innerText =
            "✅ Slot "+slot+
            " का नाम Save हो गया";


        status.style.color =
            "green";


    }catch(error){

        console.error(error);


        alert(
            "नाम Save नहीं हुआ। Firebase Error देखें।"
        );

    }

};


/* =========================
   DELETE
========================= */

window.deleteName =
async function(type,slot){

    const collectionName =
        type === "light"
        ? "light_names"
        : "pandal_names";


    const typeName =
        type === "light"
        ? "लाइट मिस्त्री"
        : "पंडाल मिस्त्री";


    const yes =
        confirm(
            typeName+
            " Slot "+slot+
            " का नाम Delete करना है?"
        );


    if(!yes)
        return;


    try{

        await deleteDoc(
            doc(
                db,
                collectionName,
                String(slot)
            )
        );


        status.innerText =
            "🗑️ Slot "+slot+
            " का नाम Delete हो गया";


        status.style.color =
            "red";


    }catch(error){

        console.error(error);


        alert(
            "नाम Delete नहीं हुआ।"
        );

    }

};

</script>

</body>
</html>
