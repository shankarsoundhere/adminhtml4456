<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Light Mistri</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#28a745">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
body{font-family:Arial;background:#f1f3f6;padding:10px;}
.box{max-width:700px;margin:auto;background:white;padding:15px;border-radius:10px;}
input,select,button{width:100%;padding:10px;margin:5px 0;box-sizing:border-box;}
button{background:#28a745;color:white;border:none;border-radius:5px;cursor:pointer;}
.printBtn{background:#007bff;}

table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px;}
td,th{border:1px solid #000;padding:6px;text-align:center;}
th{background:#ddd;}
.btn{padding:4px 6px;font-size:12px;width:auto;margin:2px;}

.noteText{
text-align:left !important;
padding-left:8px;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
z-index:999;
}

.modal-content{
background:white;
width:90%;
max-width:400px;
margin:100px auto;
padding:15px;
border-radius:10px;
}
</style>
</head>

<body>

<div class="box">

<h2>💡 लाइट मिस्त्री</h2>

<select id="slot" onchange="loadData()">
<option value="1">राकेश</option>
<option value="2">चंदन</option>
<option value="3">नुनु</option>
<option value="4">विकाश ड्राइवर</option>
<option value="5">बब्लू ड्राइवर</option>
<option value="6">Slot 6</option>
<option value="7">Slot 7</option>
<option value="8">Slot 8</option>
<option value="9">Slot 9</option>
<option value="10">Slot 10</option>
</select>

<input id="date" placeholder="दिनांक जैसे 02-05-2026">
<input id="work" placeholder="काम">
<input id="place" placeholder="जगह">
<input id="note" placeholder="नोट">

<button onclick="saveData()">💾 Save</button>
<button class="printBtn" onclick="printData()">🖨️ Print</button>

<h3>📋 Main Data</h3>
<table>
<thead>
<tr>
<th>दिनांक</th>
<th>काम</th>
<th>जगह</th>
<th>Action</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<h3>📝 Notes Table</h3>
<table>
<thead>
<tr>
<th>नोट</th>
<th>Action</th>
</tr>
</thead>
<tbody id="noteBody"></tbody>
</table>

</div>

<div class="modal" id="mainModal">
<div class="modal-content">

<h3>✏️ Edit Main Data</h3>

<input id="edit_date" placeholder="दिनांक">
<input id="edit_work" placeholder="काम">
<input id="edit_place" placeholder="जगह">

<button onclick="updateMainData()">Update</button>
<button onclick="closeMainModal()" style="background:red;">Close</button>

</div>
</div>

<div class="modal" id="noteModal">
<div class="modal-content">

<h3>✏️ Edit Note</h3>

<input id="edit_note" placeholder="नोट">

<button onclick="updateNoteData()">Update</button>
<button onclick="closeNoteModal()" style="background:red;">Close</button>

</div>
</div>

<script type="module">

import {
db,
collection,
addDoc,
onSnapshot,
deleteDoc,
doc,
getDoc,
updateDoc
} from "./firebase.js";

let editId = null;
let unsubscribe = null;

const $ = (id)=>document.getElementById(id);

function colName(){
return "light_slot_" + $("slot").value;
}

function dateToNumber(dateStr){
if(!dateStr || dateStr === "-") return 99999999;

let parts = dateStr.split("-");
if(parts.length !== 3) return 99999999;

let day = parts[0].padStart(2,"0");
let month = parts[1].padStart(2,"0");
let year = parts[2];

return Number(year + month + day);
}

window.saveData = async function(){

let hasMainData = $("date").value.trim() || $("work").value.trim() || $("place").value.trim();
let hasNote = $("note").value.trim();

if(!hasMainData && !hasNote){
alert("कुछ तो लिखो");
return;
}

try{

await addDoc(collection(db,colName()),{
date: $("date").value.trim() || "-",
work: $("work").value.trim() || "",
place: $("place").value.trim() || "",
note: $("note").value.trim() || "",
time: Date.now()
});

alert("Saved Successfully");

$("date").value="";
$("work").value="";
$("place").value="";
$("note").value="";

}catch(e){
alert("Error : " + e.message);
}

}

window.loadData = function(){

if(unsubscribe){
unsubscribe();
}

unsubscribe = onSnapshot(collection(db,colName()),(snap)=>{

$("tbody").innerHTML="";
$("noteBody").innerHTML="";

let mainData = [];
let notes = [];

snap.forEach(d=>{
let x = d.data();

if(
(x.date && x.date !== "-") ||
(x.work && x.work.trim() !== "") ||
(x.place && x.place.trim() !== "")
){
mainData.push({
id:d.id,
date:x.date || "",
work:x.work || "",
place:x.place || "",
time:x.time || 0
});
}

if((x.note || "").trim() !== ""){
notes.push({
id:d.id,
note:x.note,
time:x.time || 0
});
}

});

mainData.sort((a,b)=>{
let dateA = dateToNumber(a.date);
let dateB = dateToNumber(b.date);

if(dateA === dateB){
return a.time - b.time;
}

return dateA - dateB;
});

mainData.forEach(x=>{
$("tbody").innerHTML += `
<tr>
<td>${x.date || ""}</td>
<td>${x.work || ""}</td>
<td>${x.place || ""}</td>
<td>
<button class="btn" onclick="openMainEdit('${x.id}')">✏️ Edit</button>
<button class="btn" onclick="deleteData('${x.id}')">🗑️ Delete</button>
</td>
</tr>
`;
});

notes.sort((a,b)=>a.time - b.time);

notes.forEach(n=>{
$("noteBody").innerHTML += `
<tr>
<td class="noteText">• ${n.note}</td>
<td>
<button class="btn" onclick="openNoteEdit('${n.id}')">✏️ Edit</button>
<button class="btn" onclick="deleteData('${n.id}')">🗑️ Delete</button>
</td>
</tr>
`;
});

});

}

window.deleteData = async function(id){

if(confirm("Delete करना है?")){
await deleteDoc(doc(db,colName(),id));
alert("Deleted Successfully");
}

}

window.openMainEdit = async function(id){

let snap = await getDoc(doc(db,colName(),id));

if(!snap.exists()){
alert("Data नहीं मिला");
return;
}

let d = snap.data();

editId = id;

$("edit_date").value = d.date || "";
$("edit_work").value = d.work || "";
$("edit_place").value = d.place || "";

$("mainModal").style.display="block";
}

window.closeMainModal = function(){
$("mainModal").style.display="none";
editId = null;
}

window.updateMainData = async function(){

if(!editId){
alert("पहले Edit select करो");
return;
}

await updateDoc(doc(db,colName(),editId),{
date: $("edit_date").value.trim() || "-",
work: $("edit_work").value.trim() || "",
place: $("edit_place").value.trim() || ""
});

$("mainModal").style.display="none";
editId = null;

alert("Main Updated");
}

window.openNoteEdit = async function(id){

let snap = await getDoc(doc(db,colName(),id));

if(!snap.exists()){
alert("Data नहीं मिला");
return;
}

let d = snap.data();

editId = id;

$("edit_note").value = d.note || "";

$("noteModal").style.display="block";
}

window.closeNoteModal = function(){
$("noteModal").style.display="none";
editId = null;
}

window.updateNoteData = async function(){

if(!editId){
alert("पहले Edit select करो");
return;
}

await updateDoc(doc(db,colName(),editId),{
note: $("edit_note").value.trim() || ""
});

$("noteModal").style.display="none";
editId = null;

alert("Note Updated");
}

window.printData = function(){

let mainRows = "";
document.querySelectorAll("#tbody tr").forEach(tr=>{
let tds = tr.querySelectorAll("td");
mainRows += `
<tr>
<td>${tds[0]?.innerText || ""}</td>
<td>${tds[1]?.innerText || ""}</td>
<td>${tds[2]?.innerText || ""}</td>
</tr>`;
});

let noteRows = "";
document.querySelectorAll("#noteBody tr").forEach(tr=>{
let tds = tr.querySelectorAll("td");
noteRows += `
<tr>
<td class="printNote">${tds[0]?.innerText || ""}</td>
</tr>`;
});

let win = window.open("");

win.document.write(`
<html>
<head>
<title>Print</title>
<style>
body{font-family:Arial;padding:12px;}
h2{text-align:center;margin:5px 0 12px 0;font-size:20px;}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px;}
th{border:1px solid #000;padding:6px;background:#e5e5e5;text-align:center;}
td{border:1px solid #000;padding:6px;text-align:center;}
.printNote{text-align:left !important;padding-left:10px;}
@media print{
body{padding:5px;}
table{page-break-inside:auto;}
tr{page-break-inside:avoid;page-break-after:auto;}
}
</style>
</head>
<body>

<h2>💡 ${$("slot").options[$("slot").selectedIndex].text}</h2>

<table>
<tr>
<th>दिनांक</th>
<th>काम</th>
<th>जगह</th>
</tr>
${mainRows}
</table>

<br>

<table>
<tr>
<th>नोट</th>
</tr>
${noteRows}
</table>

</body>
</html>
`);

win.document.close();
win.focus();
win.print();

}

loadData();

</script>

<script src="pwa.js"></script>

</body>
</html>
