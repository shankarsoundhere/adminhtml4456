<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f8f9fa;
  color:#212529;
}

/* Header */
.header{
  background:#ffffff;
  color:#000;
  text-align:center;
  padding:15px;
  font-size:20px;
  font-weight:bold;
  border-bottom:1px solid #dee2e6;
  position:sticky;
  top:0;
}

/* Container */
.box{
  width:100%;
  max-width:480px;
  margin:auto;
  padding:12px;
}

/* Card */
.card{
  width:100%;
  background:#ffffff;
  padding:16px;
  margin:12px 0;
  border-radius:12px;
  font-size:17px;
  display:flex;
  align-items:center;
  gap:14px;
  cursor:pointer;
  border:1px solid #dee2e6;
  transition:0.15s;
}

.card:active{
  transform:scale(0.98);
  background:#f1f3f6;
}

/* Icon */
.icon{
  font-size:26px;
  width:35px;
  text-align:center;
}

/* Logout */
.logout{
  background:#ff4d4d;
  color:white;
  justify-content:center;
  font-weight:bold;
  border:none;
}

.logout:active{
  background:#e60000;
}

/* Mobile */
@media(max-width:480px){
  .card{
    font-size:16px;
    padding:15px;
  }
}
</style>
</head>

<body>

<script>
if(localStorage.getItem("login") !== "true"){
  location.href = "index.html";
}
</script>

<div class="header">📋 Dashboard</div>

<div class="box">

<div class="card" onclick="go('light.html')">
  <span class="icon">💡</span>
  <span>लाइट मिस्त्री</span>
</div>

<div class="card" onclick="go('jharkila.html')">
  <span class="icon">👷</span>
  <span>झारकिला लेबर</span>
</div>

<div class="card" onclick="go('pandal.html')">
  <span class="icon">⛺</span>
  <span>पंडाल मिस्त्री</span>
</div>

<div class="card" onclick="go('bakaya.html')">
  <span class="icon">📖</span>
  <span>बकाया</span>
</div>

<div class="card" onclick="go('sound.html')">
  <span class="icon">📡</span>
  <span>Sound System</span>
</div>

<div class="card logout" onclick="logout()">
  🚪 Logout
</div>

</div>

<script>
function go(page){
  location.href = page;
}

function logout(){
  localStorage.removeItem("login");
  location.href = "index.html";
}
</script>

<script src="pwa.js"></script>

</body>
</html>
