<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d6efd">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f8f9fa;
  color:#212529;
}

/* Header */
.header{
  background:#0d6efd;
  color:white;
  text-align:center;
  padding:16px;
  font-size:20px;
  font-weight:bold;
  position:sticky;
  top:0;
  z-index:1000;
}

/* Container */
.box{
  width:100%;
  max-width:480px;
  margin:auto;
  padding:14px;
}

/* Card */
.card{
  width:100%;
  background:#ffffff;
  padding:18px;
  margin:12px 0;
  border-radius:14px;
  font-size:18px;
  display:flex;
  align-items:center;
  gap:14px;
  cursor:pointer;
  box-shadow:0 3px 8px rgba(0,0,0,0.08);
  transition:0.15s;
  user-select:none;
}

.card:active{
  transform:scale(0.98);
  background:#f1f3f6;
}

.icon{
  font-size:28px;
  width:35px;
  text-align:center;
}

.card span:last-child{
  font-weight:500;
}

/* Logout */
.logout{
  background:#dc3545;
  color:white;
  justify-content:center;
  font-weight:bold;
  margin-top:18px;
}

.logout:active{
  background:#bb2d3b;
}

@media(max-width:480px){
  .header{
    font-size:19px;
    padding:15px;
  }

  .box{
    padding:12px;
  }

  .card{
    font-size:17px;
    padding:17px;
    border-radius:13px;
  }
}
</style>
</head>

<body>

<script>
if(localStorage.getItem("login") !== "true"){
  location.href = "index.html";
}
</script>

<div class="header">📋 Dashboard</div>

<div class="box">

<div class="card" onclick="go('light.html')">
  <span class="icon">💡</span>
  <span>लाइट मिस्त्री</span>
</div>

<div class="card" onclick="go('jharkila.html')">
  <span class="icon">👷</span>
  <span>झारकिला लेबर</span>
</div>

<div class="card" onclick="go('pandal.html')">
  <span class="icon">⛺</span>
  <span>पंडाल मिस्त्री</span>
</div>

<div class="card" onclick="go('bakaya.html')">
  <span class="icon">📖</span>
  <span>बकाया</span>
</div>

<div class="card" onclick="go('sound.html')">
  <span class="icon">📡</span>
  <span>Sound System</span>
</div>

<div class="card logout" onclick="logout()">
  🚪 Logout
</div>

</div>

<script>
function go(page){
  location.href = page;
}

function logout(){
  localStorage.removeItem("login");
  location.href = "index.html";
}
</script>

<script src="pwa.js"></script>

</body>
</html>
