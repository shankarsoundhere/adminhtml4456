<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f8f9fa;
  color:#212529;
}

.box{
  width:100%;
  max-width:480px;
  margin:auto;
  padding:12px;
}

.card{
  width:100%;
  background:#ffffff;
  padding:16px;
  margin:12px 0;
  border-radius:12px;
  font-size:17px;
  display:flex;
  align-items:center;
  gap:14px;
  cursor:pointer;
  border:1px solid #dee2e6;
  transition:0.15s;
}

.card:active{
  transform:scale(0.98);
  background:#f1f3f6;
}

.icon{
  font-size:26px;
  width:35px;
  text-align:center;
}

.logout{
  text-align:center;
  margin-top:20px;
  font-size:14px;
  color:#ff4d4d;
  cursor:pointer;
  font-weight:bold;
}

.logout:active{opacity:0.6;}

@media(max-width:480px){
  .card{
    font-size:16px;
    padding:15px;
  }
}
</style>
</head>

<body>

<script>
if(sessionStorage.getItem("login") !== "true"){
  location.replace("index.html");
}
</script>

<div class="box">

<div class="card" onclick="go('light.html')">
  <span class="icon">💡</span>
  <span>लाइट मिस्त्री</span>
</div>

<div class="card" onclick="go('jharkila.html')">
  <span class="icon">👷</span>
  <span>झारकिला लेबर</span>
</div>

<div class="card" onclick="go('pandal.html')">
  <span class="icon">⛺</span>
  <span>पंडाल मिस्त्री</span>
</div>

<div class="card" onclick="go('vview.html')">
  <span class="icon">📜</span>
  <span>हिसाब बकाया</span>
</div>

<div class="card" onclick="go('bakaya.html')">
  <span class="icon">📖</span>
  <span>बकाया</span>
</div>

<div class="card" onclick="go('sound.html')">
  <span class="icon">📡</span>
  <span>साटा बुकिंग</span>
</div>

<div class="logout" onclick="logout()">
  Logout
</div>

</div>

<script>
function go(page){
  location.href = page;
}

function logout(){
  sessionStorage.removeItem("login");
  location.replace("index.html");
}

/* Back button दबाने पर login page */
history.pushState(null, "", location.href);
window.addEventListener("popstate", function(){
  sessionStorage.removeItem("login");
  location.replace("index.html");
});
</script>

<script src="pwa.js"></script>

</body>
</html>
