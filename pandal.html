<!DOCTYPE html>
<html lang="hi">
<head>

<style>
body{font-family:Arial;background:#f1f3f6;padding:10px;}

width:100%;
padding:10px;
margin:5px 0;

}

button{
background:#28a745;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

.printBtn{background:#007bff;}

.dateWrap{position:relative;}

.datePicker{
position:absolute;
left:0;
top:5px;
width:100%;
height:40px;
opacity:0;
z-index:2;
cursor:pointer;
}

width:100%;
border-collapse:collapse;
margin-top:10px;
font-size:13px;
}

td,th{
border:1px solid #000;
padding:6px;
text-align:center;
}

th{background:#ddd;}

.btn{
padding:4px 6px;
font-size:12px;
width:auto;
margin:2px;
}

.noteText{
text-align:left !important;
padding-left:8px;
}

.modal{

position:fixed;
top:0;
left:0;
width:100%;
height:100%;

width:90%;
max-width:400px;

align-items:center;
justify-content:space-between;

border:1px solid #ffeeba;
padding:8px 12px;

}

border-color:#f5c6cb;

display:flex;
align-items:center;
gap:8px;
cursor:pointer;
margin:0;
}

width:18px;
height:18px;
margin:0;
cursor:pointer;

}
</style>
</head>

<body>

<div class="box">

<h2>🏠 पंडाल मिस्त्री</h2>

id="work"
placeholder="हाजरी"
>

<input
id="place"
placeholder="जगह"
>

id="note"
placeholder="नोट"
>

id="saveBtn"
onclick="saveData()"

💾 Save

<input
id="edit_date"
placeholder="दिनांक"
readonly
>

<input
id="editDatePicker"
class="datePicker"
type="date"
>

</div>

<input
id="edit_work"
placeholder="काम"
>

<input
id="edit_place"
placeholder="जगह"
>

id="mainUpdateBtn"
onclick="updateMainData()"
>
Update

onclick="closeMainModal()"

id="edit_note"
placeholder="नोट"
>

id="noteUpdateBtn"
onclick="updateNoteData()"
>
Update

class="redBtn"
>
Close

<!-- DELETE -->

<div class="modal" id="deleteModal">

<div class="modal-content deleteBox">

<h3>Delete करना है?</h3>

क्या आप इस data को delete करना चाहते हैं?
</p>

<button
onclick="confirmDelete()"
class="redBtn"
>
🗑️ Delete
</button>

<button
onclick="closeDeleteModal()"

Cancel

<script type="module">

import {
db,
collection,
addDoc,
onSnapshot,
deleteDoc,
doc,
getDoc,
updateDoc
} from "./firebase.js";


let editId = null;
let deleteId = null;
let pendingDeleteId = null;
let unsubscribe = null;
let unsubscribeNames = null;
let isDeleteUnlocked = false;


const $ = (id) =>
document.getElementById(id);


/* =====================================================
   COMMON DELETE MODE LOGIC
===================================================== */

function updateDeleteUI(){
    const bar = $("deleteModeBar");
    const status = $("deleteModeStatus");
    const chk = $("commonDeleteCheck");

    chk.checked = isDeleteUnlocked;

    if(isDeleteUnlocked){
        bar.classList.add("unlocked");
        status.textContent = "🔓 ON";
    } else {
        bar.classList.remove("unlocked");
        status.textContent = "🔒 OFF";
    }

    document.querySelectorAll(".delActionBtn").forEach(btn => {
        if(isDeleteUnlocked){
            btn.classList.remove("delBtnLocked");
        } else {
            btn.classList.add("delBtnLocked");
        }
    });
}

function openPasswordPrompt(targetDeleteId = null){
    pendingDeleteId = targetDeleteId;
    $("deletePassInput").value = "";
    $("passErrorMsg").style.display = "none";
    $("passModal").style.display = "block";
    setTimeout(() => $("deletePassInput").focus(), 100);
}

$("commonDeleteCheck").addEventListener("change", function(){
    if(this.checked){
        this.checked = false;
        openPasswordPrompt(null);
    } else {
        isDeleteUnlocked = false;
        pendingDeleteId = null;
        updateDeleteUI();
    }
});

$("deletePassInput").addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        verifyDeletePassword();
    }
});

window.verifyDeletePassword = async function(){
    const entered = $("deletePassInput").value.trim();
    const errEl = $("passErrorMsg");
    const btn = $("verifyPassBtn");

    if(!entered){
        errEl.textContent = "कृपया पासवर्ड डालें।";
        errEl.style.display = "block";
        return;
    }

    btn.disabled = true;
    btn.textContent = "जाँच हो रही है...";

    try{
        const snap = await getDoc(doc(db, "security", "config"));
        const savedPass = snap.exists() ? String(snap.data().deletePassword || "") : "";

        if(!savedPass){
            errEl.textContent = "अभी कोई Delete Password सेट नहीं है। पहले Dashboard → Password से पासवर्ड सेट करें।";
            errEl.style.display = "block";
        } else if(entered === savedPass){
            isDeleteUnlocked = true;
            $("passModal").style.display = "none";
            updateDeleteUI();

            if(pendingDeleteId){
                const idToDelete = pendingDeleteId;
                pendingDeleteId = null;
                deleteId = idToDelete;
                $("deleteModal").style.display = "block";
            }
        } else {
            errEl.textContent = "❌ गलत पासवर्ड!";
            errEl.style.display = "block";
        }
    } catch(err){
        console.error(err);
        errEl.textContent = "त्रुटि हुई: इंटरनेट या Firebase जाँचें।";
        errEl.style.display = "block";
    } finally {
        btn.disabled = false;
        btn.textContent = "Unlock Delete";
    }
};

window.closePassModal = function(){
    $("passModal").style.display = "none";
    pendingDeleteId = null;
    isDeleteUnlocked = false;
    updateDeleteUI();
};

window.addEventListener("beforeunload", () => {
    isDeleteUnlocked = false;
});

window.addEventListener("pagehide", () => {
    isDeleteUnlocked = false;
    updateDeleteUI();
});


/*
==================================================
PANDAL NAMES FIREBASE से READ
==================================================
*/

function loadPandalNames(){

    const nameCollection =
        collection(
            db,
            "pandal_names"
        );

    unsubscribeNames =
        onSnapshot(
            nameCollection,
            (snap) => {

                const select =
                    $("slot");

                const currentSlot =
                    select.value;

                select.innerHTML = "";

                const names = [];


                snap.forEach((d) => {

                    const slot =
                        Number(d.id);

                    const data =
                        d.data();


                    if(
                        !isNaN(slot) &&
                        data.name &&
                        data.name.trim() !== ""
                    ){

                        names.push({

                            slot:slot,

                            name:
                                data.name.trim()

                        });

                    }

                });


                names.sort(
                    (a,b) =>
                    a.slot - b.slot
                );


                names.forEach((item) => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        String(item.slot);

                    option.textContent =
                        item.name;

                    select.appendChild(
                        option
                    );

                });


                if(
                    currentSlot &&
                    names.some(
                        item =>
                        String(item.slot)
                        === String(currentSlot)
                    )
                ){

                    select.value =
                        currentSlot;

                }

                else if(names.length){

                    select.value =
                        String(
                            names[0].slot
                        );

                }


                if(names.length){

                    loadData();

                }
                else{

                    $("tbody").innerHTML =
                        "";

                    $("noteBody").innerHTML =
                        "";

                }

            },

            (error) => {

                console.error(
                    "Pandal Name Firebase Error:",
                    error
                );

            }
        );

}


/*
==================================================
PANDAL DATA COLLECTION
==================================================
*/

function colName(){

    return "pandal_slot_" +
        $("slot").value;

}


/*
==================================================
DATE FUNCTIONS
==================================================
*/

function isoToDDMMYYYY(iso){

    if(!iso)
        return "";

    let p =
        iso.split("-");

    return p[2] +
        "-" +
        p[1] +
        "-" +
        p[0];

}


function ddmmyyyyToISO(dateStr){

    if(
        !dateStr ||
        dateStr === "-"
    )
        return "";

    let p =
        dateStr.split("-");

    if(p.length !== 3)
        return "";

    return p[2] +
        "-" +
        p[1].padStart(2,"0") +
        "-" +
        p[0].padStart(2,"0");

}


/*
==================================================
DATE PICKER
==================================================
*/

$("datePicker")
.addEventListener(
    "change",
    function(){

        $("date").value =
            isoToDDMMYYYY(
                this.value
            );

    }
);


$("editDatePicker")
.addEventListener(
    "change",
    function(){

        $("edit_date").value =
            isoToDDMMYYYY(
                this.value
            );

    }
);


/*
==================================================
DATE SORT
==================================================
*/

function dateToNumber(dateStr){

    if(
        !dateStr ||
        dateStr === "-"
    )
        return 99999999;

    let parts =
        dateStr.split("-");

    if(parts.length !== 3)
        return 99999999;

    let day =
        parts[0].padStart(2,"0");

    let month =
        parts[1].padStart(2,"0");

    let year =
        parts[2];

    return Number(
        year +
        month +
        day
    );

}


/*
==================================================
BUTTON TEXT
==================================================
*/

function buttonText(
    btnId,
    newText,
    oldText
){

    $(btnId).innerText =
        newText;

    setTimeout(() => {

        $(btnId).innerText =
            oldText;

    },1200);

}


/*
==================================================
SAVE DATA
==================================================
*/

window.saveData =
async function(){

    let hasMainData =
        $("date").value.trim() ||
        $("work").value.trim() ||
        $("place").value.trim();


    let hasNote =
        $("note").value.trim();


    if(
        !hasMainData &&
        !hasNote
    ){

        buttonText(
            "saveBtn",
            "कुछ तो लिखो",
            "💾 Save"
        );

        return;

    }


    try{

        await addDoc(
            collection(
                db,
                colName()
            ),
            {

                date:
                    $("date")
                    .value
                    .trim()
                    || "-",

                work:
                    $("work")
                    .value
                    .trim()
                    || "",

                place:
                    $("place")
                    .value
                    .trim()
                    || "",

                note:
                    $("note")
                    .value
                    .trim()
                    || "",

                time:
                    Date.now()

            }
        );


        $("date").value = "";

        $("datePicker").value = "";

        $("work").value = "";

        $("place").value = "";

        $("note").value = "";


        buttonText(
            "saveBtn",
            "✅ Saved",
            "💾 Save"
        );


    }catch(e){

        console.error(e);


        buttonText(
            "saveBtn",
            "Error",
            "💾 Save"
        );

    }

};


/*
==================================================
LOAD DATA
==================================================
*/

window.loadData =
function(){

    if(
        !$("slot").value
    ){

        $("tbody").innerHTML = "";
        $("noteBody").innerHTML = "";

        return;

    }


    if(unsubscribe){

        unsubscribe();

    }


    unsubscribe =
        onSnapshot(
            collection(
                db,
                colName()
            ),
            (snap) => {

                $("tbody").innerHTML =
                    "";

                $("noteBody").innerHTML =
                    "";


                let mainData = [];

                let notes = [];


                snap.forEach(d => {

                    let x =
                        d.data();


                    if(

                        (x.date &&
                         x.date !== "-")

                        ||

                        (x.work &&
                         x.work.trim() !== "")

                        ||

                        (x.place &&
                         x.place.trim() !== "")

                    ){

                        mainData.push({

                            id:
                                d.id,

                            date:
                                x.date || "",

                            work:
                                x.work || "",

                            place:
                                x.place || "",

                            time:
                                x.time || 0

                        });

                    }


                    if(
                        (x.note || "")
                        .trim() !== ""
                    ){

                        notes.push({

                            id:
                                d.id,

                            note:
                                x.note,

                            time:
                                x.time || 0

                        });

                    }

                });


                mainData.sort(
                    (a,b) => {

                        let dateA =
                            dateToNumber(
                                a.date
                            );


                        let dateB =
                            dateToNumber(
                                b.date
                            );


                        if(
                            dateA === dateB
                        ){

                            return a.time -
                                b.time;

                        }


                        return dateA -
                            dateB;

                    }
                );


                const lockClass = isDeleteUnlocked ? "" : "delBtnLocked";


                mainData.forEach(x => {

                    $("tbody")
                    .innerHTML += `

                    <tr>

                    <td>
                        ${x.date || ""}
                    </td>

                    <td>
                        ${x.work || ""}
                    </td>

                    <td>
                        ${x.place || ""}
                    </td>

                    <td>

                    <button
                    class="btn"
                    onclick="openMainEdit('${x.id}')"
                    >
                    ✏️ Edit
                    </button>


                    <button
                    class="btn delActionBtn ${lockClass}"
                    onclick="openDeleteModal('${x.id}')"
                    >
                    🗑️ Delete
                    </button>

                    </td>

                    </tr>

                    `;

                });


                notes.sort(
                    (a,b) =>
                        a.time - b.time
                );


                notes.forEach(n => {

                    $("noteBody")
                    .innerHTML += `

                    <tr>

                    <td class="noteText">
                        • ${n.note}
                    </td>

                    <td>

                    <button
                    class="btn"
                    onclick="openNoteEdit('${n.id}')"
                    >
                    ✏️ Edit
                    </button>


                    <button
                    class="btn delActionBtn ${lockClass}"
                    onclick="openDeleteModal('${n.id}')"
                    >
                    🗑️ Delete
                    </button>

                    </td>

                    </tr>

                    `;

                });

            }
        );

};


/*
==================================================
DELETE MODAL
==================================================
*/

window.openDeleteModal =
function(id){

    if(!isDeleteUnlocked){
        openPasswordPrompt(id);
        return;
    }

    deleteId = id;

    $("deleteModal")
    .style
    .display =
    "block";

};


window.closeDeleteModal =
function(){

    deleteId = null;

    $("deleteModal")
    .style
    .display =
    "none";

};


window.confirmDelete =
async function(){

    if(!isDeleteUnlocked){
        $("deleteModal").style.display = "none";
        openPasswordPrompt(deleteId);
        return;
    }

    if(!deleteId)
        return;


    await deleteDoc(
        doc(
            db,
            colName(),
            deleteId
        )
    );


    deleteId = null;


    $("deleteModal")
    .style
    .display =
    "none";

};


/*
==================================================
EDIT MAIN DATA
==================================================
*/

window.openMainEdit =
async function(id){

    let snap =
        await getDoc(
            doc(
                db,
                colName(),
                id
            )
        );


    if(!snap.exists())
        return;


    let d =
        snap.data();


    editId = id;


    $("edit_date").value =
        d.date || "";


    $("editDatePicker").value =
        ddmmyyyyToISO(
            d.date || ""
        );


    $("edit_work").value =
        d.work || "";


    $("edit_place").value =
        d.place || "";


    $("mainModal")
    .style
    .display =
    "block";

};


window.closeMainModal =
function(){

    $("mainModal")
    .style
    .display =
    "none";


    editId = null;

};


window.updateMainData =
async function(){

    if(!editId){

        buttonText(
            "mainUpdateBtn",
            "पहले Edit select करो",
            "Update"
        );

        return;

    }


    await updateDoc(
        doc(
            db,
            colName(),
            editId
        ),
        {

            date:
                $("edit_date")
                .value
                .trim()
                || "-",

            work:
                $("edit_work")
                .value
                .trim()
                || "",

            place:
                $("edit_place")
                .value
                .trim()
                || ""

        }
    );


    buttonText(
        "mainUpdateBtn",
        "Updated",
        "Update"
    );


    setTimeout(() => {

        $("mainModal")
        .style
        .display =
        "none";


        editId = null;

    },500);

};


/*
==================================================
EDIT NOTE
==================================================
*/

        );

    await updateDoc(

    );

        $("noteModal")

/*
==================================================
PRINT
==================================================
*/

window.printData =
function(){

    let mainRows = "";


    document
    .querySelectorAll("#tbody tr")
    .forEach(tr => {

        let tds =
            tr.querySelectorAll("td");


        mainRows += `

        <tr>

        <td>
            ${tds[0]?.innerText || ""}
        </td>

        <td>
            ${tds[1]?.innerText || ""}
        </td>

        <td>
            ${tds[2]?.innerText || ""}
        </td>

        </tr>

        `;

    });


    let noteRows = "";


    document
    .querySelectorAll("#noteBody tr")
    .forEach(tr => {

        let tds =
            tr.querySelectorAll("td");


        noteRows += `

        <tr>

        <td class="printNote">
            ${tds[0]?.innerText || ""}
        </td>

        </tr>

        `;

    });


    let win =
        window.open("");


    win.document.write(`

    <html>

    <head>

    <title>Print</title>

    <style>

    body{
        font-family:Arial;
        padding:12px;
    }

    h2{
        text-align:center;
        margin:5px 0 12px 0;
        font-size:20px;
    }

    table{
        width:100%;
        border-collapse:collapse;
        font-size:14px;
        margin-top:8px;
    }

    th{
        border:1px solid #000;
        padding:6px;
        background:#e5e5e5;
        text-align:center;
    }

    td{
        border:1px solid #000;
        padding:6px;
        text-align:center;
    }

    .printNote{
        text-align:left !important;
        padding-left:10px;
    }

    @media print{

        body{
            padding:5px;
        }
