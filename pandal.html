<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>पंडाल मिस्त्री</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#28a745">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
body{font-family:Arial;background:#f1f3f6;padding:10px;}

.box{
max-width:1000px;
margin:auto;
background:white;
padding:15px;
border-radius:10px;
}

textarea,button{
width:100%;
padding:10px;
margin:5px 0;
box-sizing:border-box;
font-size:16px;
}

button{
background:#28a745;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

table{
width:100%;
margin-top:10px;
border-collapse:collapse;
}

td{
border:1px solid #000;
padding:10px;
vertical-align:top;
line-height:1.8;
font-size:16px;
}

.title{
font-size:22px;
font-weight:bold;
margin-top:20px;
}

.itemBox{
border-bottom:1px solid #ccc;
padding-bottom:8px;
margin-bottom:8px;
}

.action{
display:flex;
gap:5px;
margin-top:8px;
}

.action button{
width:auto;
padding:6px 12px;
font-size:14px;
}

.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
justify-content:center;
align-items:center;
z-index:999;
}

.popup-box{
background:white;
padding:15px;
border-radius:10px;
width:90%;
max-width:500px;
}

.redBtn{background:red;}
.blueBtn{background:#007bff;}

@media print{
textarea,button,.print-hide,.popup{display:none !important;}
body{background:white;}
.box{box-shadow:none;border-radius:0;}
}
</style>
</head>

<body>

<div class="box">

<h2>🎪 पंडाल मिस्त्री</h2>

<textarea id="note1" placeholder="नोट"></textarea>
<textarea id="note2" placeholder="नोट"></textarea>

<button id="saveBtn" onclick="saveData()">💾 Save</button>
<button onclick="printData()">🖨️ Print</button>

<div id="table1Section" style="display:none;">
<div class="title">हाजरी</div>
<table><tr><td id="table1Data"></td></tr></table>
</div>

<div id="table2Section" style="display:none;">
<div class="title">हिसाब</div>
<table><tr><td id="table2Data"></td></tr></table>
</div>

</div>

<div class="popup" id="editPopup">
<div class="popup-box">

<h3>Edit Data</h3>

<textarea id="editNote1"></textarea>
<textarea id="editNote2"></textarea>

<button id="updateBtn" onclick="updateData()">Update</button>
<button class="redBtn" onclick="closePopup()">Cancel</button>

</div>
</div>

<div class="popup" id="deletePopup">
<div class="popup-box">

<h3>Delete करना है?</h3>
<p>क्या आप इस data को delete करना चाहते हैं?</p>

<button class="redBtn" onclick="confirmDelete()">🗑️ Delete</button>
<button class="blueBtn" onclick="closeDeletePopup()">Cancel</button>

</div>
</div>

<script type="module">

import {
db,
collection,
addDoc,
onSnapshot,
deleteDoc,
doc,
updateDoc,
getDoc
} from "./firebase.js";

let editId=null;
let deleteId=null;

const $ = (id)=>document.getElementById(id);

function buttonText(btnId,newText,oldText){
$(btnId).innerText=newText;
setTimeout(()=>{
$(btnId).innerText=oldText;
},1200);
}

function bullet(txt){
let html="";
(txt||"").split("\n").forEach(line=>{
if(line.trim()!==""){
html+="• "+line.trim()+"<br>";
}
});
return html;
}

window.saveData=async()=>{

let data={
note1:$("note1").value.trim(),
note2:$("note2").value.trim(),
time:Date.now()
};

if(!data.note1 && !data.note2){
buttonText("saveBtn","कुछ लिखो","💾 Save");
return;
}

await addDoc(collection(db,"pandal"),data);

$("note1").value="";
$("note2").value="";

buttonText("saveBtn","✅ Saved","💾 Save");
};

onSnapshot(collection(db,"pandal"),snap=>{

let arr=[];

snap.forEach(d=>{
let x=d.data();
arr.push({
id:d.id,
note1:x.note1||"",
note2:x.note2||"",
time:x.time||0
});
});

arr.sort((a,b)=>a.time-b.time);

let t1="",t2="";
let has1=false,has2=false;

arr.forEach(x=>{

if(x.note1){
has1=true;
t1+=`
<div class="itemBox">
${bullet(x.note1)}
<div class="action print-hide">
<button onclick="editData('${x.id}')">Edit</button>
<button onclick="openDeletePopup('${x.id}')">Delete</button>
</div>
</div>`;
}

if(x.note2){
has2=true;
t2+=`
<div class="itemBox">
${bullet(x.note2)}
<div class="action print-hide">
<button onclick="editData('${x.id}')">Edit</button>
<button onclick="openDeletePopup('${x.id}')">Delete</button>
</div>
</div>`;
}

});

$("table1Data").innerHTML=t1;
$("table2Data").innerHTML=t2;

$("table1Section").style.display=has1?"block":"none";
$("table2Section").style.display=has2?"block":"none";

});

window.openDeletePopup=(id)=>{
deleteId=id;
$("deletePopup").style.display="flex";
}

window.closeDeletePopup=()=>{
deleteId=null;
$("deletePopup").style.display="none";
}

window.confirmDelete=async()=>{
if(!deleteId) return;

await deleteDoc(doc(db,"pandal",deleteId));

deleteId=null;
$("deletePopup").style.display="none";
}

window.editData=async(id)=>{
let snap = await getDoc(doc(db,"pandal",id));

if(!snap.exists()){
return;
}

let x=snap.data();

$("editNote1").value=x.note1||"";
$("editNote2").value=x.note2||"";

editId=id;
$("editPopup").style.display="flex";
}

window.updateData=async()=>{
if(!editId){
buttonText("updateBtn","पहले Edit चुनो","Update");
return;
}

await updateDoc(doc(db,"pandal",editId),{
note1:$("editNote1").value.trim(),
note2:$("editNote2").value.trim()
});

buttonText("updateBtn","Updated","Update");

setTimeout(()=>{
closePopup();
},500);
}

window.closePopup=()=>{
$("editPopup").style.display="none";
editId=null;
}

window.printData=()=>window.print();

</script>

<script src="pwa.js"></script>

<script>

  history.pushState(null, "", location.href);

  window.addEventListener("popstate", function(){
    localStorage.removeItem("login");
    location.replace("index.html"); 
  });
})();
</script>

</body>
</html>
