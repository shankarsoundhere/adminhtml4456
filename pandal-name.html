<script type="module">

import {

db,
collection,
onSnapshot,
doc,
updateDoc,
deleteDoc,
getDoc,
setDoc

} from "./firebase.js";


/* =========================
   FIREBASE COLLECTION
========================= */

const colRef =
collection(db,"pandal_names");


/* =========================
   FIREBASE BACKGROUND UPDATE
========================= */

onSnapshot(

colRef,

(snapshot)=>{

    snapshot.forEach(item=>{

        const slot =
            Number(item.id);

        if(slot < 1 || slot > 10)
            return;


        const data =
            item.data();


        const input =
            document.getElementById(
                "pandal-name-"+slot
            );


        if(!input)
            return;


        /*
           अगर user अभी Edit नहीं कर रहा है,
           तभी Firebase का नाम लगाएं
        */

        if(input.disabled){

            if(data.name){

                input.value =
                    data.name;

            }

        }

    });

},

(error)=>{

    console.error(
        "Firebase Error:",
        error
    );

});


/* =========================
   EDIT
========================= */

window.editName =
function(slot){

    const input =
        document.getElementById(
            "pandal-name-"+slot
        );


    const editBtn =
        document.getElementById(
            "pandal-edit-"+slot
        );


    const saveBtn =
        document.getElementById(
            "pandal-save-"+slot
        );


    input.disabled = false;

    input.focus();

    editBtn.disabled = true;

    saveBtn.disabled = false;

};


/* =========================
   SAVE
========================= */

window.saveName =
async function(slot){

    const input =
        document.getElementById(
            "pandal-name-"+slot
        );


    const name =
        input.value.trim();


    if(name === ""){

        alert(
            "नाम खाली नहीं हो सकता।"
        );

        return;

    }


    try{

        const nameRef =
            doc(
                db,
                "pandal_names",
                String(slot)
            );


        const oldData =
            await getDoc(nameRef);


        if(oldData.exists()){

            await updateDoc(

                nameRef,

                {
                    name:name,
                    slot:slot,
                    time:Date.now()
                }

            );

        }else{

            await setDoc(

                nameRef,

                {
                    name:name,
                    slot:slot,
                    time:Date.now()
                }

            );

        }


        input.disabled = true;


        document.getElementById(
            "pandal-edit-"+slot
        ).disabled = false;


        document.getElementById(
            "pandal-save-"+slot
        ).disabled = true;


    }catch(error){

        console.error(error);

        alert(
            "नाम Save नहीं हुआ। Firebase Error देखें।"
        );

    }

};


/* =========================
   DELETE
========================= */

window.deleteName =
async function(slot){

    const yes =
        confirm(
            "पंडाल मिस्त्री Slot "+
            slot+
            " का नाम Delete करना है?"
        );


    if(!yes)
        return;


    try{

        await deleteDoc(

            doc(
                db,
                "pandal_names",
                String(slot)
            )

        );


        /*
           Delete के बाद default नाम
           वापस दिखाएं
        */

        const defaultNames = {

            1:"पंडाल Slot 1",
            2:"पंडाल Slot 2",
            3:"पंडाल Slot 3",
            4:"पंडाल Slot 4",
            5:"पंडाल Slot 5",
            6:"पंडाल Slot 6",
            7:"पंडाल Slot 7",
            8:"पंडाल Slot 8",
            9:"पंडाल Slot 9",
            10:"पंडाल Slot 10"

        };


        document.getElementById(
            "pandal-name-"+slot
        ).value =
            defaultNames[slot];


    }catch(error){

        console.error(error);

        alert(
            "नाम Delete नहीं हुआ।"
        );

    }

};

</script>
