<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>पंडाल मिस्त्री नाम</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#007bff">

<link rel="icon" href="icon-192.png">

<link rel="apple-touch-icon"
href="icon-192.png">

<style>

body{
    margin:0;
    padding:10px;
    font-family:Arial,sans-serif;
    background:#f1f3f6;
}

.box{
    max-width:700px;
    margin:auto;
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

h2{
    text-align:center;
    margin-top:5px;
    margin-bottom:20px;
}

.section-title{
    background:#007bff;
    color:white;
    padding:12px;
    border-radius:7px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin:10px 0 12px;
}

.row{
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    margin-bottom:10px;
    background:#fafafa;
}

.slot{
    font-weight:bold;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:10px;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
    margin-bottom:8px;
}

button{
    padding:9px 12px;
    margin-right:5px;
    border:none;
    border-radius:5px;
    color:white;
    cursor:pointer;
    font-size:14px;
}

.editBtn{
    background:#007bff;
}

.saveBtn{
    background:#28a745;
}

.deleteBtn{
    background:#dc3545;
}

.addBtn{
    width:100%;
    background:#17a2b8;
    margin-top:5px;
    margin-bottom:15px;
    font-size:16px;
    padding:12px;
}

button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

.empty{
    text-align:center;
    color:#777;
    padding:20px;
}

</style>

</head>


<body>


<div class="box">

<h2>✏️ पंडाल मिस्त्री नाम</h2>


<div class="section-title">
🏠 पंडाल मिस्त्री
</div>


<button
class="addBtn"
onclick="addSlot()"
>
➕ नया Slot जोड़ें
</button>


<div id="pandalList"></div>


</div>


<script type="module">

import {

db,
collection,
onSnapshot,
doc,
updateDoc,
deleteDoc,
getDoc,
setDoc

} from "./firebase.js";


/* =========================
   FIREBASE COLLECTION
========================= */

const colRef =
collection(
    db,
    "pandal_names"
);


/* =========================
   SLOT LIST
========================= */

let slotData = {};


/* =========================
   RENDER ALL SLOTS
========================= */

function renderSlots(){

    const list =
        document.getElementById(
            "pandalList"
        );


    const slots =
        Object.keys(slotData)
        .map(Number)
        .filter(
            n =>
            Number.isFinite(n) &&
            n > 0
        )
        .sort(
            (a,b)=>a-b
        );


    list.innerHTML = "";


    if(slots.length === 0){

        list.innerHTML = `
            <div class="empty">
                अभी कोई Slot नहीं है।
            </div>
        `;

        return;

    }


    slots.forEach(slot=>{

        const data =
            slotData[String(slot)] || {};


        const row =
            document.createElement(
                "div"
            );

        row.className = "row";


        row.innerHTML = `

            <div class="slot">
                🏠 Slot ${slot}
            </div>

            <input
                id="pandal-name-${slot}"
                type="text"
                value="${escapeHTML(data.name || "")}"
                disabled
            >

            <button
                class="editBtn"
                id="pandal-edit-${slot}"
            >
                ✏️ Edit
            </button>

            <button
                class="saveBtn"
                id="pandal-save-${slot}"
                disabled
            >
                💾 Save
            </button>

            <button
                class="deleteBtn"
                id="pandal-delete-${slot}"
            >
                🗑️ Delete
            </button>

        `;


        list.appendChild(row);


        /* EDIT */

        document.getElementById(
            "pandal-edit-"+slot
        ).onclick =
        function(){

            editName(slot);

        };


        /* SAVE */

        document.getElementById(
            "pandal-save-"+slot
        ).onclick =
        function(){

            saveName(slot);

        };


        /* DELETE */

        document.getElementById(
            "pandal-delete-"+slot
        ).onclick =
        function(){

            deleteName(slot);

        };

    });

}


/* =========================
   HTML SAFE TEXT
========================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   FIREBASE REALTIME UPDATE
========================= */

onSnapshot(

    colRef,

    (snapshot)=>{

        slotData = {};


        snapshot.forEach(item=>{

            const slot =
                Number(item.id);


            if(
                !Number.isFinite(slot) ||
                slot <= 0
            ){

                return;

            }


            slotData[String(slot)] =
                item.data();

        });


        renderSlots();

    },

    (error)=>{

        console.error(
            "Firebase Error:",
            error
        );

    }

);


/* =========================
   ADD NEW SLOT
========================= */

window.addSlot =
async function(){

    const slots =
        Object.keys(slotData)
        .map(Number)
        .filter(
            n =>
            Number.isFinite(n) &&
            n > 0
        );


    let nextSlot = 1;


    if(slots.length > 0){

        nextSlot =
            Math.max(...slots) + 1;

    }


    try{

        const nameRef =
            doc(
                db,
                "pandal_names",
                String(nextSlot)
            );


        await setDoc(

            nameRef,

            {
                name:"",
                slot:nextSlot,
                time:Date.now()
            }

        );


        setTimeout(()=>{

            const input =
                document.getElementById(
                    "pandal-name-"+nextSlot
                );


            if(input){

                input.disabled = false;

                input.focus();

            }

        },300);


    }catch(error){

        console.error(error);

        alert(
            "नया Slot नहीं बनाया गया।"
        );

    }

};


/* =========================
   EDIT
========================= */

window.editName =
function(slot){

    const input =
        document.getElementById(
            "pandal-name-"+slot
        );


    const editBtn =
        document.getElementById(
            "pandal-edit-"+slot
        );


    const saveBtn =
        document.getElementById(
            "pandal-save-"+slot
        );


    if(!input)
        return;


    input.disabled = false;

    input.focus();

    editBtn.disabled = true;

    saveBtn.disabled = false;

};


/* =========================
   SAVE
========================= */

window.saveName =
async function(slot){

    const input =
        document.getElementById(
            "pandal-name-"+slot
        );


    if(!input)
        return;


    const name =
        input.value.trim();


    if(name === ""){

        alert(
            "नाम खाली नहीं हो सकता।"
        );

        return;

    }


    try{

        const nameRef =
            doc(
                db,
                "pandal_names",
                String(slot)
            );


        const oldData =
            await getDoc(nameRef);


        if(oldData.exists()){

            await updateDoc(

                nameRef,

                {
                    name:name,
                    slot:slot,
                    time:Date.now()
                }

            );

        }else{

            await setDoc(

                nameRef,

                {
                    name:name,
                    slot:slot,
                    time:Date.now()
                }

            );

        }


        input.disabled = true;


        document.getElementById(
            "pandal-edit-"+slot
        ).disabled = false;


        document.getElementById(
            "pandal-save-"+slot
        ).disabled = true;


    }catch(error){

        console.error(error);

        alert(
            "नाम Save नहीं हुआ। Firebase Error देखें।"
        );

    }

};


/* =========================
   DELETE
========================= */

window.deleteName =
async function(slot){

    const yes =
        confirm(
            "पंडाल मिस्त्री Slot "+
            slot+
            " का नाम Delete करना है?"
        );


    if(!yes)
        return;


    try{

        await deleteDoc(

            doc(
                db,
                "pandal_names",
                String(slot)
            )

        );


        delete slotData[String(slot)];


        renderSlots();


    }catch(error){

        console.error(error);

        alert(
            "नाम Delete नहीं हुआ।"
        );

    }

};


</script>


<script src="pwa.js"></script>

</body>

</html>
