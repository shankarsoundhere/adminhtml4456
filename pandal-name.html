<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>पंडाल मिस्त्री नाम</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#007bff">

<link rel="icon" href="icon-192.png">

<link rel="apple-touch-icon"
href="icon-192.png">

<style>

body{
    margin:0;
    padding:10px;
    font-family:Arial,sans-serif;
    background:#f1f3f6;
}

.box{
    max-width:700px;
    margin:auto;
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

h2{
    text-align:center;
    margin-top:5px;
    margin-bottom:20px;
}

.section-title{
    background:#007bff;
    color:white;
    padding:12px;
    border-radius:7px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin:10px 0 12px;
}

/* =========================
   COMMON DELETE TICK BAR
========================= */

.security-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#fff3cd;
    border:1px solid #ffeeba;
    padding:10px 12px;
    border-radius:7px;
    margin-bottom:12px;
    font-size:14px;
    font-weight:bold;
    color:#856404;
}

.security-bar.unlocked{
    background:#f8d7da;
    border-color:#f5c6cb;
    color:#721c24;
}

.security-label{
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    user-select:none;
    margin:0;
}

.security-label input[type="checkbox"]{
    width:18px;
    height:18px;
    margin:0;
    cursor:pointer;
}

.delBtnLocked{
    opacity:0.45;
}

.row{
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    margin-bottom:10px;
    background:#fafafa;
}

.slot{
    font-weight:bold;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:10px;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
    margin-bottom:8px;
}

button{
    padding:9px 12px;
    margin-right:5px;
    border:none;
    border-radius:5px;
    color:white;
    cursor:pointer;
    font-size:14px;
}

.editBtn{
    background:#007bff;
}

.saveBtn{
    background:#28a745;
}

.deleteBtn{
    background:#dc3545;
}

.addBtn{
    width:100%;
    background:#17a2b8;
    margin-top:5px;
    font-size:16px;
    padding:12px;
}

button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

.empty{
    text-align:center;
    color:#777;
    padding:20px;
}

/* =========================
   CUSTOM MODAL & TOAST
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    z-index:9999;
    padding:15px;
}

.modal-content{
    background:white;
    width:100%;
    max-width:380px;
    margin:100px auto;
    padding:18px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 6px 20px rgba(0,0,0,0.2);
}

.modal-content h3{
    margin:0 0 8px 0;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.modal-actions button{
    flex:1;
    margin:0;
    padding:11px;
    font-size:15px;
    font-weight:bold;
}

#toastMsg{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    background:#222;
    color:white;
    padding:11px 18px;
    border-radius:10px;
    font-size:14px;
    z-index:99999;
    display:none;
    box-shadow:0 3px 12px rgba(0,0,0,0.25);
    text-align:center;
    max-width:90%;
}

</style>

</head>


<body>


<div class="box">

<h2>✏️ पंडाल मिस्त्री नाम</h2>

<div class="section-title">
🏠 पंडाल मिस्त्री
</div>

<!-- =========================
     COMMON DELETE SECURITY TICK
========================== -->

<div class="security-bar" id="securityBar">
    <label class="security-label">
        <input type="checkbox" id="commonDeleteTick">
        <span>Common Delete Mode</span>
    </label>
    <span id="securityStatus">🔒 OFF</span>
</div>

<div id="pandalList"></div>

<button
class="addBtn"
onclick="addSlot()"
>
➕ नया Slot जोड़ें
</button>

</div>


<!-- ==================================================
     COMMON DELETE PASSWORD MODAL
================================================== -->

<div class="modal" id="passModal">
    <div class="modal-content">
        <h3>🔐 Delete Password</h3>
        <p style="font-size:14px; color:#444; margin:6px 0;">Common Delete Mode चालू करने के लिए पासवर्ड डालें:</p>
        <input type="password" id="deletePassInput" placeholder="पासवर्ड डालें" autocomplete="off">
        <p id="passErrorMsg" style="color:#dc3545; font-size:13px; display:none; margin:5px 0;"></p>
        <div class="modal-actions">
            <button class="editBtn" id="verifyPassBtn">Unlock Delete</button>
            <button class="deleteBtn" id="closePassBtn">Cancel</button>
        </div>
    </div>
</div>


<!-- ==================================================
     CONFIRM DELETE MODAL
================================================== -->

<div class="modal" id="deleteModal">
    <div class="modal-content">
        <h3>Delete करना है?</h3>
        <p id="deleteConfirmText" style="font-size:14px; color:#444; margin:8px 0;"></p>
        <div class="modal-actions">
            <button class="deleteBtn" id="confirmDeleteBtn">🗑️ Delete</button>
            <button class="editBtn" id="cancelDeleteBtn">Cancel</button>
        </div>
    </div>
</div>


<div id="toastMsg"></div>


<script type="module">

import {

db,
collection,
onSnapshot,
doc,
updateDoc,
deleteDoc,
getDoc,
setDoc

} from "./firebase.js";


/* =====================================================
   COMMON PASSWORD & DELETE SECURITY SYSTEM
===================================================== */

let isCommonDeleteUnlocked = false;
let pendingDeleteSlot = null;
let targetDeleteSlot = null;

const commonTick = document.getElementById("commonDeleteTick");
const securityBar = document.getElementById("securityBar");
const securityStatus = document.getElementById("securityStatus");

function showToast(msg){
    const box = document.getElementById("toastMsg");
    box.textContent = msg;
    box.style.display = "block";
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => {
        box.style.display = "none";
    }, 2400);
}

function updateSecurityUI(){
    commonTick.checked = isCommonDeleteUnlocked;
    if(isCommonDeleteUnlocked){
        securityBar.classList.add("unlocked");
        securityStatus.textContent = "🔓 ON";
    } else {
        securityBar.classList.remove("unlocked");
        securityStatus.textContent = "🔒 OFF";
    }

    document.querySelectorAll(".deleteBtn.slotDelBtn").forEach(btn => {
        if(isCommonDeleteUnlocked){
            btn.classList.remove("delBtnLocked");
        } else {
            btn.classList.add("delBtnLocked");
        }
    });
}

function openPasswordPrompt(slotToDelete = null){
    pendingDeleteSlot = slotToDelete;
    document.getElementById("deletePassInput").value = "";
    document.getElementById("passErrorMsg").style.display = "none";
    document.getElementById("passModal").style.display = "block";
    setTimeout(() => document.getElementById("deletePassInput").focus(), 100);
}

async function verifyDeletePassword(){
    const enteredPass = document.getElementById("deletePassInput").value.trim();
    const errEl = document.getElementById("passErrorMsg");
    const btn = document.getElementById("verifyPassBtn");

    if(!enteredPass){
        errEl.textContent = "कृपया पासवर्ड डालें।";
        errEl.style.display = "block";
        return;
    }

    btn.disabled = true;
    btn.textContent = "जाँच हो रही है...";

    try{
        const passDocRef = doc(db, "security", "config");
        const passSnap = await getDoc(passDocRef);

        if(!passSnap.exists() || !passSnap.data().deletePassword){
            errEl.textContent = "अभी कोई Delete Password सेट नहीं है। पहले Dashboard → Password से पासवर्ड सेट करें।";
            errEl.style.display = "block";
        } else {
            const realPassword = String(passSnap.data().deletePassword);
            if(enteredPass === realPassword){
                isCommonDeleteUnlocked = true;
                document.getElementById("passModal").style.display = "none";
                updateSecurityUI();

                if(pendingDeleteSlot !== null){
                    const s = pendingDeleteSlot;
                    pendingDeleteSlot = null;
                    openDeleteConfirmModal(s);
                }
            } else {
                errEl.textContent = "❌ गलत पासवर्ड!";
                errEl.style.display = "block";
            }
        }
    } catch(err){
        console.error("Password Verification Error:", err);
        errEl.textContent = "त्रुटि हुई: इंटरनेट या Firebase जांचें।";
        errEl.style.display = "block";
    } finally {
        btn.disabled = false;
        btn.textContent = "Unlock Delete";
    }
}

function closePassModal(){
    document.getElementById("passModal").style.display = "none";
    pendingDeleteSlot = null;
    isCommonDeleteUnlocked = false;
    updateSecurityUI();
}

document.getElementById("verifyPassBtn").addEventListener("click", verifyDeletePassword);
document.getElementById("closePassBtn").addEventListener("click", closePassModal);
document.getElementById("deletePassInput").addEventListener("keypress", function(e){
    if(e.key === "Enter") verifyDeletePassword();
});

/* Tick ON/OFF हैंडलर */
commonTick.addEventListener("change", function(){
    if(commonTick.checked){
        commonTick.checked = false;
        openPasswordPrompt(null);
    } else {
        isCommonDeleteUnlocked = false;
        pendingDeleteSlot = null;
        updateSecurityUI();
    }
});

/* पेज छोड़ते ही Tick अपने आप OFF हो जाए */
function resetSecurityOnLeave(){
    isCommonDeleteUnlocked = false;
    pendingDeleteSlot = null;
    if(commonTick) commonTick.checked = false;
    updateSecurityUI();
}

window.addEventListener("pagehide", resetSecurityOnLeave);
window.addEventListener("beforeunload", resetSecurityOnLeave);
window.addEventListener("pageshow", resetSecurityOnLeave);


const colRef =
collection(
    db,
    "pandal_names"
);


let slotData = {};


function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function renderSlots(){

    const list =
        document.getElementById(
            "pandalList"
        );

    const slots =
        Object.keys(slotData)
        .map(Number)
        .filter(
            n =>
            Number.isFinite(n) &&
            n > 0
        )
        .sort(
            (a,b)=>a-b
        );

    list.innerHTML = "";

    if(slots.length === 0){

        list.innerHTML = `
            <div class="empty">
                अभी कोई Slot नहीं है।
            </div>
        `;

        return;
    }

    const lockClass = isCommonDeleteUnlocked ? "" : "delBtnLocked";

    slots.forEach(slot=>{

        const data =
            slotData[String(slot)] || {};


        const row =
            document.createElement("div");

        row.className = "row";


        row.innerHTML = `

            <div class="slot">
                🏠 Slot ${slot}
            </div>

            <input
                id="pandal-name-${slot}"
                type="text"
                value="${escapeHTML(data.name || "")}"
                disabled
            >

            <button
                class="editBtn"
                id="pandal-edit-${slot}"
            >
                ✏️ Edit
            </button>

            <button
                class="saveBtn"
                id="pandal-save-${slot}"
                disabled
            >
                💾 Save
            </button>

            <button
                class="deleteBtn slotDelBtn ${lockClass}"
                id="pandal-delete-${slot}"
            >
                🗑️ Delete
            </button>
        `;


        list.appendChild(row);


        document.getElementById(
            "pandal-edit-"+slot
        ).onclick = function(){

            editName(slot);

        };


        document.getElementById(
            "pandal-save-"+slot
        ).onclick = function(){

            saveName(slot);

        };


        document.getElementById(
            "pandal-delete-"+slot
        ).onclick = function(){

            deleteName(slot);

        };

    });

}


onSnapshot(

    colRef,

    (snapshot)=>{

        slotData = {};

        snapshot.forEach(item=>{

            const slot =
                Number(item.id);

            if(
                !Number.isFinite(slot) ||
                slot <= 0
            ){

                return;

            }

            slotData[String(slot)] =
                item.data();

        });

        renderSlots();

    },

    (error)=>{

        console.error(
            "Firebase Error:",
            error
        );

    }

);


window.addSlot =
async function(){

    const slots =
        Object.keys(slotData)
        .map(Number)
        .filter(
            n =>
            Number.isFinite(n) &&
            n > 0
        );


    let nextSlot = 1;


    if(slots.length > 0){

        nextSlot =
            Math.max(...slots) + 1;

    }


    try{

        await setDoc(

            doc(
                db,
                "pandal_names",
                String(nextSlot)
            ),

            {
                name:"",
                slot:nextSlot,
                time:Date.now()
            }

        );


        setTimeout(()=>{

            const input =
                document.getElementById(
                    "pandal-name-"+nextSlot
                );

            if(input){

                input.disabled = false;
                input.focus();

            }

        },300);


    }catch(error){

        console.error(error);

        showToast("❌ नया Slot नहीं बनाया गया।");

    }

};


window.editName =
function(slot){

    const input =
        document.getElementById(
            "pandal-name-"+slot
        );

    const editBtn =
        document.getElementById(
            "pandal-edit-"+slot
        );

    const saveBtn =
        document.getElementById(
            "pandal-save-"+slot
        );


    if(!input)
        return;


    input.disabled = false;
    input.focus();

    editBtn.disabled = true;
    saveBtn.disabled = false;

};


window.saveName =
async function(slot){

    const input =
        document.getElementById(
            "pandal-name-"+slot
        );


    if(!input)
        return;


    const name =
        input.value.trim();


    if(name === ""){

        showToast("नाम खाली नहीं हो सकता।");
        input.focus();

        return;

    }


    try{

        const nameRef =
            doc(
                db,
                "pandal_names",
                String(slot)
            );


        const oldData =
            await getDoc(nameRef);


        if(oldData.exists()){

            await updateDoc(

                nameRef,

                {
                    name:name,
                    slot:slot,
                    time:Date.now()
                }

            );

        }else{

            await setDoc(

                nameRef,

                {
                    name:name,
                    slot:slot,
                    time:Date.now()
                }

            );

        }


        input.disabled = true;

        document.getElementById(
            "pandal-edit-"+slot
        ).disabled = false;

        document.getElementById(
            "pandal-save-"+slot
        ).disabled = true;

        showToast("✅ नाम Save हो गया");


    }catch(error){

        console.error(error);

        showToast("❌ नाम Save नहीं हुआ।");

    }

};


function openDeleteConfirmModal(slot){
    targetDeleteSlot = slot;
    document.getElementById("deleteConfirmText").textContent =
        "पंडाल मिस्त्री Slot " + slot + " का नाम Delete करना है?";
    document.getElementById("deleteModal").style.display = "block";
}

function closeDeleteConfirmModal(){
    targetDeleteSlot = null;
    document.getElementById("deleteModal").style.display = "none";
}

document.getElementById("cancelDeleteBtn").addEventListener("click", closeDeleteConfirmModal);

document.getElementById("confirmDeleteBtn").addEventListener("click", async function(){
    if(!isCommonDeleteUnlocked){
        closeDeleteConfirmModal();
        openPasswordPrompt(targetDeleteSlot);
        return;
    }

    if(targetDeleteSlot === null)
        return;

    const slot = targetDeleteSlot;
    closeDeleteConfirmModal();

    try{

        await deleteDoc(

            doc(
                db,
                "pandal_names",
                String(slot)
            )

        );

        delete slotData[String(slot)];

        renderSlots();

        showToast("🗑️ नाम Delete हो गया");


    }catch(error){

        console.error(error);

        showToast("❌ नाम Delete नहीं हुआ।");

    }
});


window.deleteName =
function(slot){

    if(!isCommonDeleteUnlocked){
        openPasswordPrompt(slot);
        return;
    }

    openDeleteConfirmModal(slot);

};

updateSecurityUI();

</script>


<script src="pwa.js"></script>

</body>

</html>
