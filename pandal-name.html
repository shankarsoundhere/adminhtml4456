<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>पंडाल मिस्त्री नाम</title><style>

body{
    margin:0;
    padding:10px;
    font-family:Arial,sans-serif;
    background:#f1f3f6;
}

.box{
    max-width:700px;
    margin:auto;
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

h2{
    text-align:center;
    margin-top:5px;
    margin-bottom:20px;
}

.section-title{
    background:#007bff;
    color:white;
    padding:12px;
    border-radius:7px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin:10px 0 12px;
}

.row{
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    margin-bottom:10px;
    background:#fafafa;
}

.slot{
    font-weight:bold;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:10px;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
    margin-bottom:8px;
}

button{
    padding:9px 12px;
    margin-right:5px;
    border:none;
    border-radius:5px;
    color:white;
    cursor:pointer;
    font-size:14px;
}

.editBtn{
    background:#007bff;
}

.saveBtn{
    background:#28a745;
}

.deleteBtn{
    background:#dc3545;
}

button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

#status{
    text-align:center;
    margin-bottom:15px;
    font-weight:bold;
}

</style></head><body><div class="box"><h2>✏️ पंडाल मिस्त्री नाम</h2><div id="status">
Firebase से नाम लोड हो रहे हैं...
</div><div class="section-title">
🏠 पंडाल मिस्त्री
</div><div id="pandalList"></div></div><script type="module">

import {
    db,
    collection,
    onSnapshot,
    doc,
    updateDoc,
    deleteDoc,
    getDoc,
    setDoc
} from "./firebase.js";


const status =
    document.getElementById("status");


/* =========================
   DEFAULT NAMES
========================= */

const defaultNames = {

    1:"पंडाल Slot 1",
    2:"पंडाल Slot 2",
    3:"पंडाल Slot 3",
    4:"पंडाल Slot 4",
    5:"पंडाल Slot 5",
    6:"पंडाल Slot 6",
    7:"पंडाल Slot 7",
    8:"पंडाल Slot 8",
    9:"पंडाल Slot 9",
    10:"पंडाल Slot 10"

};


/* =========================
   HTML SAFE
========================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   CREATE ROWS
========================= */

function createRows(firebaseData){

    const container =
        document.getElementById("pandalList");

    container.innerHTML = "";


    for(let slot=1; slot<=10; slot++){

        let firebaseName = "";


        if(
            firebaseData[slot] &&
            firebaseData[slot].name
        ){

            firebaseName =
                firebaseData[slot].name;

        }else{

            firebaseName =
                defaultNames[slot];

        }


        const row =
            document.createElement("div");

        row.className = "row";


        row.innerHTML = `

        <div class="slot">
            🏠 Slot ${slot}
        </div>

        <input
            id="pandal-name-${slot}"
            type="text"
            value="${escapeHTML(firebaseName)}"
            disabled
        >

        <button
            class="editBtn"
            id="pandal-edit-${slot}"
            onclick="editName(${slot})"
        >
            ✏️ Edit
        </button>

        <button
            class="saveBtn"
            id="pandal-save-${slot}"
            onclick="saveName(${slot})"
            disabled
        >
            💾 Save
        </button>

        <button
            class="deleteBtn"
            onclick="deleteName(${slot})"
        >
            🗑️ Delete
        </button>

        `;


        container.appendChild(row);

    }

}


/* =========================
   LOAD FIREBASE
========================= */

onSnapshot(

    collection(db,"pandal_names"),

    (snapshot)=>{

        const data = {};


        snapshot.forEach(item=>{

            const slot =
                Number(item.id);


            if(slot>=1 && slot<=10){

                data[slot] =
                    item.data();

            }

        });


        createRows(data);


        status.innerText =
            "नाम Firebase से लोड हो गए";

        status.style.color =
            "green";

    },

    (error)=>{

        console.error(
            "Firebase Error:",
            error
        );

        status.innerText =
            "Firebase Error: Pandal Names";

        status.style.color =
            "red";

    }

);


/* =========================
   EDIT
========================= */

window.editName =
function(slot){

    const input =
        document.getElementById(
            "pandal-name-"+slot
        );


    const editBtn =
        document.getElementById(
            "pandal-edit-"+slot
        );


    const saveBtn =
        document.getElementById(
            "pandal-save-"+slot
        );


    input.disabled = false;

    input.focus();

    editBtn.disabled = true;

    saveBtn.disabled = false;

};


/* =========================
   SAVE
========================= */

window.saveName =
async function(slot){

    const input =
        document.getElementById(
            "pandal-name-"+slot
        );


    const name =
        input.value.trim();


    if(name===""){

        alert(
            "नाम खाली नहीं हो सकता।"
        );

        return;

    }


    try{

        const nameRef =
            doc(
                db,
                "pandal_names",
                String(slot)
            );


        const oldData =
            await getDoc(nameRef);


        if(oldData.exists()){

            await updateDoc(
                nameRef,
                {
                    name:name,
                    slot:slot,
                    time:Date.now()
                }
            );

        }else{

            await setDoc(
                nameRef,
                {
                    name:name,
                    slot:slot,
                    time:Date.now()
                }
            );

        }


        input.disabled = true;


        document.getElementById(
            "pandal-edit-"+slot
        ).disabled = false;


        document.getElementById(
            "pandal-save-"+slot
        ).disabled = true;


        status.innerText =
            "✅ Slot "+slot+
            " का नाम Save हो गया";

        status.style.color =
            "green";


    }catch(error){

        console.error(error);

        alert(
            "नाम Save नहीं हुआ। Firebase Error देखें।"
        );

    }

};


/* =========================
   DELETE
========================= */

window.deleteName =
async function(slot){

    const yes =
        confirm(
            "पंडाल मिस्त्री Slot "+
            slot+
            " का नाम Delete करना है?"
        );


    if(!yes)
        return;


    try{

        await deleteDoc(
            doc(
                db,
                "pandal_names",
                String(slot)
            )
        );


        status.innerText =
            "🗑️ Slot "+slot+
            " का नाम Delete हो गया";

        status.style.color =
            "red";


    }catch(error){

        console.error(error);

        alert(
            "नाम Delete नहीं हुआ।"
        );

    }

};

</script>
</body>
</html>
