<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>बकाया Admin Panel</title>

<style>
body {
  font-family: Arial;
  background: #dcdde1;
  padding: 10px;
  margin: 0
}

.container {
  max-width: 500px;
  margin: auto
}

h2 {
  text-align: center
}

.formBox,.box {
  background: #f1f2f6;
  padding: 12px;
  margin: 12px 0;
  border-radius: 15px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1)
}

input,textarea,button {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  font-size: 15px;
  box-sizing: border-box;
  border-radius: 8px;
  border: 1px solid #aaa
}

textarea {
  min-height: 75px;
  resize: vertical
}

button {
  border: none;
  background: #28a745;
  color: white;
  font-weight: bold;
  cursor: pointer
}

.updateBtn { background:#0984e3; display:none }
.cancelBtn { background:#636e72; display:none }

#phone2 { display:none }

.topList{
  background:#ffffff;
  padding:10px;
  margin:12px 0;
  border-radius:15px;
  box-shadow:0 4px 8px rgba(0,0,0,0.08);
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.topList a{
  padding:6px 10px;
  background:#ffffff;
  color:#000;
  border-radius:20px;
  text-decoration:none;
  font-size:12px;
  font-weight:bold;
  border:1px solid #ddd;
}

.bottom {
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start
}

.nameBox {
  font-size:14px;
  font-weight:bold;
}

.toggle {
  font-size:12px;
  color:blue;
  cursor:pointer;
}

.number {
  display:none;
  font-size:13px;
  color:blue;
}

.detail {
  margin-top:8px;
  font-size:13px;
}

.innerGrid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
}

.action {
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.smallBtn {
  padding:7px 10px;
  font-size:12px;
  border-radius:20px;
  color:white;
  border:none;
}

.edit { background:#0984e3 }
.del { background:#d63031 }

.call {
  background:#28a745;
  text-decoration:none;
  color:white;
  padding:7px 10px;
  font-size:12px;
  border-radius:20px
}

html{ scroll-behavior:smooth; }
</style>
</head>

<body>

<div class="container">

<h2>डायरी हिसाब</h2>

<div class="formBox">
  <input type="text" id="name" placeholder="नाम">
  <input type="tel" id="phone1" placeholder="मोबाइल नंबर">
  <input type="tel" id="phone2" placeholder="मोबाइल नंबर">

  <div id="noteContainer">
    <textarea class="noteBox" placeholder="बकाया नोट 1" ondblclick="addNoteBox(this)"></textarea>
  </div>

  <button id="saveBtn" onclick="saveData()">Save</button>
  <button id="updateBtn" class="updateBtn" onclick="updateData()">Update</button>
  <button id="cancelBtn" class="cancelBtn" onclick="cancelEdit()">Cancel</button>
</div>

<div id="topList" class="topList"></div>
<div id="list"></div>

</div>

<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  addDoc,
  onSnapshot,
  doc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const colRef = collection(db, "tdm");

let allData = [];
let editId = null;

/* 🔥 ADD NEW NOTE BOX */
window.addNoteBox = function(el){
  let container = document.getElementById("noteContainer");
  let allNotes = document.querySelectorAll(".noteBox");

  if(el !== allNotes[allNotes.length - 1]) return;

  let newBox = document.createElement("textarea");
  newBox.className = "noteBox";
  newBox.placeholder = "बकाया नोट " + (allNotes.length + 1);

  newBox.ondblclick = function(){
    addNoteBox(newBox);
  };

  container.appendChild(newBox);
}

/* SAVE */
window.saveData = async function(){
  let name = nameInput.value.trim();
  let phone1 = phone1Input.value.trim();
  let phone2 = phone2Input.value.trim();

  let notes = [...document.querySelectorAll(".noteBox")]
  .map(x=>x.value.trim())
  .filter(Boolean);

  if(!name){
    alert("नाम लिखें");
    return;
  }

  await addDoc(colRef,{
    name, phone1, phone2,
    notes,
    amount: notes.join("\n\n"),
    time: Date.now()
  });

  location.reload();
}

onSnapshot(colRef,(snap)=>{
  allData = [];
  snap.forEach(d=>{
    allData.push({id:d.id,...d.data()});
  });
  allData.sort((a,b)=>(a.time||0)-(b.time||0));
  render();
});

function render(){
  let html = "";
  let topHTML = "";

  allData.forEach((x,i)=>{
    let id = "card"+i;

    topHTML += `<a href="#${id}">${x.name}</a>`;

    html += `
    <div class="box" id="${id}">
      <div class="bottom">
        <div class="nameBox">
          👤 ${x.name}
        </div>
        <div class="action">
          <button class="smallBtn del" onclick="deleteData('${x.id}')">Delete</button>
        </div>
      </div>

      <div class="detail">
        ${(x.notes||[]).map(n=>`<div>• ${n}</div>`).join("")}
      </div>
    </div>`;
  });

  list.innerHTML = html;
  topList.innerHTML = topHTML;
}

/* DELETE */
window.deleteData = async function(id){
  let pass = prompt("Password डालें");
  if(pass !== "1234") return;
  await deleteDoc(doc(db,"tdm",id));
}

window.cancelEdit = function(){
  location.reload();
}

</script>

</body>
</html>
