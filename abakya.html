<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  addDoc,
  onSnapshot,
  doc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const colRef = collection(db, "tdm");

let allData = [];
let editId = null;

/* 🔥 DOUBLE CLICK ADD NOTE */
document.addEventListener("dblclick", function(e){
  if(e.target.classList.contains("noteBox")){
    let newBox = document.createElement("textarea");
    newBox.className = "noteBox";
    newBox.placeholder = "नया बकाया नोट";

    document.getElementById("noteContainer").appendChild(newBox);

    newBox.focus();
  }
});

function cleanPhone(phone){
  return String(phone || "").replace(/\s+/g,"").trim();
}

function escapeHTML(text){
  return String(text || "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

/* NOTES */
function noteToHTML(note){
  let lines = String(note)
  .split("\n")
  .map(t=>t.trim())
  .filter(t=>t);

  if(lines.length <= 1){
    return `
    <div class="noteItem">
      <span class="bullet">•</span>
      <span class="noteText">${escapeHTML(note)}</span>
    </div>`;
  }

  return `
  <div class="noteItem">
    <span class="bullet">•</span>
    <div class="innerGrid">
      ${lines.map(t=>`<span>${escapeHTML(t)}</span>`).join("")}
    </div>
  </div>`;
}

/* SAVE */
window.saveData = async function(){
  let name = document.getElementById("name").value.trim();
  let phone1 = document.getElementById("phone1").value.trim();
  let phone2 = document.getElementById("phone2").value.trim();

  let notes = [...document.querySelectorAll(".noteBox")]
  .map(x=>x.value.trim())
  .filter(Boolean);

  if(!name){
    alert("नाम लिखें");
    return;
  }

  await addDoc(colRef,{
    name, phone1, phone2,
    notes,
    amount: notes.join("\n\n"),
    time: Date.now()
  });

  location.reload();
}

/* LIST */
onSnapshot(colRef,(snap)=>{

  allData = [];

  snap.forEach(d=>{
    allData.push({id:d.id,...d.data()});
  });

  allData.sort((a,b)=>(a.time||0)-(b.time||0));

  render();
});

function render(){

  let html = "";
  let topHTML = "";

  allData.forEach((x,i)=>{

    let id = "card"+i;

    topHTML += `<a href="#${id}">${escapeHTML(x.name || "-")}</a>`;

    let phone1 = cleanPhone(x.phone1);
    let phone2 = cleanPhone(x.phone2);

    let notes = Array.isArray(x.notes) ? x.notes : (x.amount||"").split("\n\n");

    html += `
    <div class="box" id="${id}">

      <div class="bottom">

        <div class="nameBox">
          👤 ${escapeHTML(x.name || "-")}
          <span class="toggle" onclick="toggleNumber(${i})">Show</span>

          <div class="number" id="num${i}">
            ${phone1 ? "📞 "+escapeHTML(phone1) : ""}
            ${phone2 ? "<br>📞 "+escapeHTML(phone2) : ""}
          </div>
        </div>

        <div class="action">
          ${phone1 ? `<a class="call" href="tel:${phone1}">Call</a>` : ""}
          ${phone2 ? `<a class="call" href="tel:${phone2}">Call</a>` : ""}
          <button class="smallBtn edit" onclick="editData(${i})">Edit</button>
          <button class="smallBtn del" onclick="deleteData('${x.id}')">Delete</button>
        </div>

      </div>

      <div class="detail">
        ${(notes||[]).map(noteToHTML).join("")}
      </div>

    </div>`;
  });

  document.getElementById("list").innerHTML = html;
  document.getElementById("topList").innerHTML = topHTML;
}

/* TOGGLE */
window.toggleNumber = function(i){
  let el = document.getElementById("num"+i);
  el.style.display = el.style.display === "block" ? "none":"block";
}

/* EDIT */
window.editData = function(i){
  let x = allData[i];
  editId = x.id;

  document.getElementById("name").value = x.name;
  document.getElementById("phone1").value = x.phone1;
  document.getElementById("phone2").value = x.phone2;

  document.getElementById("saveBtn").style.display="none";
  document.getElementById("updateBtn").style.display="block";
  document.getElementById("cancelBtn").style.display="block";
}

/* UPDATE */
window.updateData = async function(){
  if(!editId) return;

  await updateDoc(doc(db,"tdm",editId),{
    name: name.value,
    phone1: phone1.value,
    phone2: phone2.value
  });

  location.reload();
}

/* DELETE */
window.deleteData = async function(id){
  let pass = prompt("Password डालें");
  if(pass !== "1234") return;

  await deleteDoc(doc(db,"tdm",id));
}

window.cancelEdit = function(){
  location.reload();
}

</script>
