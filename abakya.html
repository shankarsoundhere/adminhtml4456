<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>बकाया Admin Panel</title>

<style>
body {
  font-family: Arial;
  background: #dcdde1;
  padding: 10px;
  margin: 0
}

.container {
  max-width: 500px;
  margin: auto
}

h2 {
  text-align: center
}

.formBox,.box {
  background: #f1f2f6;
  padding: 12px;
  margin: 12px 0;
  border-radius: 15px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1)
}

input,textarea,button {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  font-size: 15px;
  box-sizing: border-box;
  border-radius: 8px;
  border: 1px solid #aaa
}

textarea {
  min-height: 75px;
  resize: vertical
}

button {
  border: none;
  background: #28a745;
  color: white;
  font-weight: bold;
  cursor: pointer
}

.updateBtn { background:#0984e3; display:none }
.cancelBtn { background:#636e72; display:none }

#phone2 { display:none }

.topList{
  background:#ffffff;
  padding:10px;
  margin:12px 0;
  border-radius:15px;
  box-shadow:0 4px 8px rgba(0,0,0,0.08);
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.topList a{
  padding:6px 10px;
  background:#ffffff;
  color:#000;
  border-radius:20px;
  text-decoration:none;
  font-size:12px;
  font-weight:bold;
  border:1px solid #ddd;
}

.box { margin-top:10px }
</style>
</head>

<body>

<div class="container">

<h2>डायरी हिसाब</h2>

<div class="formBox">
  <input type="text" id="name" placeholder="नाम">
  <input type="tel" id="phone1" placeholder="मोबाइल नंबर">
  <input type="tel" id="phone2" placeholder="मोबाइल नंबर">

  <div id="noteContainer">
    <textarea class="noteBox" placeholder="बकाया नोट 1"></textarea>
  </div>

  <button onclick="saveData()">Save</button>
</div>

<div id="list"></div>

</div>

<script>

// 🔥 DOUBLE CLICK → NEW NOTE BOX
document.getElementById("noteContainer").addEventListener("dblclick", function(e){
  if(e.target.classList.contains("noteBox")){
    let newBox = document.createElement("textarea");
    newBox.className = "noteBox";
    newBox.placeholder = "नया बकाया नोट";
    
    document.getElementById("noteContainer").appendChild(newBox);
    
    newBox.focus();
  }
});

function saveData(){
  let name = document.getElementById("name").value;
  let notes = [...document.querySelectorAll(".noteBox")]
    .map(x=>x.value)
    .filter(Boolean);

  if(!name){
    alert("नाम डालो");
    return;
  }

  let data = {
    name,
    notes
  };

  let old = JSON.parse(localStorage.getItem("data") || "[]");
  old.push(data);
  localStorage.setItem("data", JSON.stringify(old));

  location.reload();
}

function load(){
  let data = JSON.parse(localStorage.getItem("data") || "[]");
  let html = "";

  data.forEach(x=>{
    html += `
      <div class="box">
        <b>${x.name}</b>
        <ul>
          ${x.notes.map(n=>`<li>${n}</li>`).join("")}
        </ul>
      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

load();

</script>

</body>
</html>
