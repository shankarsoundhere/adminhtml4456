<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>बकाया Admin Panel</title>

<style>
body {
  font-family: Arial;
  background: #dcdde1;
  padding: 10px;
  margin: 0
}

.container {
  max-width: 500px;
  margin: auto
}

h2 { text-align: center }

.formBox,.box {
  background: #f1f2f6;
  padding: 12px;
  margin: 12px 0;
  border-radius: 15px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1)
}

input,textarea,button {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  font-size: 15px;
  box-sizing: border-box;
  border-radius: 8px;
  border: 1px solid #aaa
}

textarea {
  min-height: 75px;
  resize: vertical
}

button {
  border: none;
  background: #28a745;
  color: white;
  font-weight: bold;
  cursor: pointer
}

.updateBtn { background:#0984e3; display:none }
.cancelBtn { background:#636e72; display:none }

#phone2 { display:none }

.topList{
  background:#fff;
  padding:10px;
  margin:12px 0;
  border-radius:15px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.topList a{
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  border:1px solid #ddd;
  text-decoration:none;
  color:#000;
}

.bottom{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.nameBox{font-weight:bold}

.number{display:none;color:blue;font-size:13px}

.toggle{color:blue;cursor:pointer;font-size:12px}

.action{display:flex;gap:5px}

.smallBtn{
  padding:6px 10px;
  font-size:12px;
  border:none;
  border-radius:20px;
  color:#fff;
}

.edit{background:#0984e3}
.del{background:#d63031}
.call{background:#28a745;color:#fff;padding:6px 10px;border-radius:20px;text-decoration:none}
</style>
</head>

<body>

<div class="container">

<h2>डायरी हिसाब</h2>

<div class="formBox">
  <input type="text" id="name" placeholder="नाम">
  <input type="tel" id="phone1" placeholder="मोबाइल नंबर">
  <input type="tel" id="phone2" placeholder="मोबाइल नंबर">

  <div id="noteContainer">
    <textarea class="noteBox" placeholder="बकाया नोट 1"></textarea>
  </div>

  <button id="saveBtn" onclick="saveData()">Save</button>
  <button id="updateBtn" class="updateBtn" onclick="updateData()">Update</button>
  <button id="cancelBtn" class="cancelBtn" onclick="cancelEdit()">Cancel</button>
</div>

<div id="topList" class="topList"></div>
<div id="list"></div>

</div>

<script type="module">

import { db } from "./firebase.js";

import {
  collection, addDoc, onSnapshot,
  doc, updateDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const colRef = collection(db, "tdm");

let allData = [];
let editId = null;

/* 🔥 DOUBLE CLICK → ADD NOTE */
document.getElementById("noteContainer").addEventListener("dblclick",(e)=>{
  if(e.target.classList.contains("noteBox")){
    let box = document.createElement("textarea");
    box.className = "noteBox";
    box.placeholder = "नया बकाया नोट";
    document.getElementById("noteContainer").appendChild(box);
    box.focus();
  }
});

function cleanPhone(p){
  return String(p||"").replace(/\s+/g,"").trim();
}

function escapeHTML(t){
  return String(t||"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;");
}

function noteToHTML(note){
  return `<div>• ${escapeHTML(note)}</div>`;
}

/* SAVE */
window.saveData = async function(){
  let name = nameEl.value.trim();
  let phone1 = phone1El.value.trim();
  let phone2 = phone2El.value.trim();

  let notes = [...document.querySelectorAll(".noteBox")]
    .map(x=>x.value.trim())
    .filter(Boolean);

  if(!name){ alert("नाम लिखें"); return; }

  await addDoc(colRef,{
    name, phone1, phone2,
    notes,
    time: Date.now()
  });

  location.reload();
}

const nameEl = document.getElementById("name");
const phone1El = document.getElementById("phone1");
const phone2El = document.getElementById("phone2");

/* REALTIME LIST */
onSnapshot(colRef,(snap)=>{
  allData = [];
  snap.forEach(d=> allData.push({id:d.id,...d.data()}));
  allData.sort((a,b)=>a.time-b.time);
  render();
});

function render(){
  let html="", topHTML="";

  allData.forEach((x,i)=>{
    let id="card"+i;

    topHTML += `<a href="#${id}">${escapeHTML(x.name)}</a>`;

    html += `
    <div class="box" id="${id}">
      <div class="bottom">
        <div class="nameBox">
          ${escapeHTML(x.name)}
          <span class="toggle" onclick="toggleNumber(${i})">Show</span>
          <div class="number" id="num${i}">
            ${x.phone1||""}<br>${x.phone2||""}
          </div>
        </div>

        <div class="action">
          ${x.phone1?`<a class="call" href="tel:${x.phone1}">Call</a>`:""}
          <button class="smallBtn edit" onclick="editData(${i})">Edit</button>
          <button class="smallBtn del" onclick="deleteData('${x.id}')">Delete</button>
        </div>
      </div>

      ${x.notes.map(noteToHTML).join("")}
    </div>`;
  });

  list.innerHTML = html;
  topList.innerHTML = topHTML;
}

/* TOGGLE */
window.toggleNumber = i=>{
  let el=document.getElementById("num"+i);
  el.style.display = el.style.display==="block"?"none":"block";
}

/* EDIT */
window.editData = i=>{
  let x=allData[i];
  editId=x.id;

  nameEl.value=x.name;
  phone1El.value=x.phone1;
  phone2El.value=x.phone2;

  saveBtn.style.display="none";
  updateBtn.style.display="block";
  cancelBtn.style.display="block";
}

/* UPDATE */
window.updateData = async ()=>{
  if(!editId) return;

  await updateDoc(doc(db,"tdm",editId),{
    name:nameEl.value,
    phone1:phone1El.value,
    phone2:phone2El.value
  });

  location.reload();
}

/* DELETE */
window.deleteData = async id=>{
  let pass=prompt("Password डालें");
  if(pass!=="1234") return;

  await deleteDoc(doc(db,"tdm",id));
}

window.cancelEdit=()=>location.reload();

</script>

</body>
</html>
