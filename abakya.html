<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>बकाया Admin Panel</title>

    <style>
        body {
            font-family: Arial;
            background: #dcdde1;
            padding: 10px;
            margin: 0
        }
        .container {
            max-width: 500px;
            margin: auto
        }
        h2 {
            text-align: center
        }
        .formBox,.box {
            background: #f1f2f6;
            padding: 12px;
            margin: 12px 0;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1)
        }
        input,textarea,button {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            font-size: 15px;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #aaa
        }
        textarea {
            min-height: 75px;
            resize: vertical
        }
        button {
            border: none;
            background: #28a745;
            color: white;
            font-weight: bold;
            cursor: pointer
        }
        .updateBtn {
            background: #0984e3;
            display: none
        }
        .cancelBtn {
            background: #636e72;
            display: none
        }
        #phone2 {
            display: none
        }
        .bottom {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: flex-start
        }
        .nameBox {
            font-size: 14px;
            font-weight: bold;
            line-height: 1.2
        }
        .toggle {
            font-size: 12px;
            color: blue;
            cursor: pointer;
            margin-left: 5px
        }
        .number {
            display: none;
            font-size: 13px;
            color: blue;
            font-weight: normal;
            line-height: 1.3;
            margin-top: 3px
        }
        .detail {
            margin-top: 8px;
            font-size: 13px;
            word-break: break-word
        }
        .noteItem {
            display: flex;
            align-items: flex-start;
            margin: 4px 0
        }
        .bullet {
            margin-right: 6px;
            font-weight: bold
        }
        .noteText {
            white-space: pre-wrap
        }
        .innerGrid {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 4px;
            width: 100%
        }
        .innerGrid span {
            font-size: 12px;
            line-height: 1.4
        }
        .action {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: flex-end
        }
        .smallBtn {
            padding: 7px 10px;
            font-size: 12px;
            border-radius: 20px;
            color: white;
            border: none;
            width: auto;
            margin: 0
        }
        .edit {
            background: #0984e3
        }
        .del {
            background: #d63031
        }
        .call {
            background: #28a745;
            text-decoration: none;
            color: white;
            padding: 7px 10px;
            font-size: 12px;
            border-radius: 20px
        }

        /* COMMON DELETE MODE BAR */
        .deleteModeBar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 10px 14px;
            border-radius: 12px;
            margin: 10px 0;
            font-size: 14px;
            font-weight: bold;
            color: #856404;
        }
        .deleteModeBar.unlocked {
            background: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        .deleteModeLabel {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            margin: 0;
        }
        .deleteModeLabel input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0;
            cursor: pointer;
        }
        .delBtnLocked {
            opacity: 0.45;
        }

        /* CUSTOM MODAL */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            padding: 15px;
        }
        .modal-content {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            margin: 100px auto;
            padding: 18px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }
        .modal-content h3 {
            margin: 0 0 8px 0;
        }
        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .modal-actions button {
            flex: 1;
            margin: 0;
        }
        .blueBtn {
            background: #0984e3;
        }
        .redBtn {
            background: #d63031;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>डायरी हिसाब</h2>

        <!-- COMMON DELETE MODE -->
        <div class="deleteModeBar" id="deleteModeBar">
            <label class="deleteModeLabel">
                <input type="checkbox" id="commonDeleteCheck">
                <span>Common Delete Mode</span>
            </label>
            <span id="deleteModeStatus">🔒 OFF</span>
        </div>

        <div class="formBox">
            <input type="text" id="name" placeholder="नाम">
            <input type="tel" id="phone1" placeholder="मोबाइल नंबर">
            <input type="tel" id="phone2" placeholder="मोबाइल नंबर">

            <div id="noteContainer">
                <textarea class="noteBox" placeholder="बकाया नोट 1"></textarea>
            </div>

            <button id="saveBtn" onclick="saveData()">Save</button>
            <button id="updateBtn" class="updateBtn" onclick="updateData()">Update</button>
            <button id="cancelBtn" class="cancelBtn" onclick="cancelEdit()">Cancel</button>
        </div>

        <div id="list"></div>

    </div>

    <!-- PASSWORD MODAL -->
    <div class="modal" id="passModal">
        <div class="modal-content">
            <h3>🔐 Delete Password</h3>
            <p style="font-size:14px; color:#444; margin:6px 0;">Common Delete Mode चालू करने के लिए पासवर्ड डालें:</p>
            <input type="password" id="deletePassInput" placeholder="पासवर्ड डालें" autocomplete="off">
            <p id="passErrorMsg" style="color:#d63031; font-size:13px; display:none; margin:5px 0;"></p>
            <div class="modal-actions">
                <button class="blueBtn" id="verifyPassBtn" onclick="verifyDeletePassword()">Unlock Delete</button>
                <button class="redBtn" onclick="closePassModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- CONFIRM DELETE MODAL -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <h3>Delete करना है?</h3>
            <p style="font-size:14px; color:#444; margin:8px 0;">क्या आप सच में इस रिकॉर्ड को delete करना चाहते हैं?</p>
            <div class="modal-actions">
                <button class="redBtn" onclick="confirmDelete()">🗑️ Delete</button>
                <button class="blueBtn" onclick="closeDeleteModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module">

        import {
            db,
            collection,
            addDoc,
            onSnapshot,
            doc,
            getDoc,
            updateDoc,
            deleteDoc
        } from "./firebase.js";

        const colRef = collection(db, "tdm");

        let allData = [];
        let editId = null;
        let deleteId = null;
        let pendingDeleteId = null;
        let isDeleteUnlocked = false;

        const $ = (id) => document.getElementById(id);

        /* =====================================================
           COMMON DELETE MODE LOGIC
        ===================================================== */
        function updateDeleteUI() {
            const bar = $("deleteModeBar");
            const status = $("deleteModeStatus");
            const chk = $("commonDeleteCheck");

            chk.checked = isDeleteUnlocked;

            if (isDeleteUnlocked) {
                bar.classList.add("unlocked");
                status.textContent = "🔓 ON";
            } else {
                bar.classList.remove("unlocked");
                status.textContent = "🔒 OFF";
            }

            document.querySelectorAll(".delActionBtn").forEach(btn => {
                if (isDeleteUnlocked) {
                    btn.classList.remove("delBtnLocked");
                } else {
                    btn.classList.add("delBtnLocked");
                }
            });
        }

        function openPasswordPrompt(targetId = null) {
            pendingDeleteId = targetId;
            $("deletePassInput").value = "";
            $("passErrorMsg").style.display = "none";
            $("passModal").style.display = "block";
            setTimeout(() => $("deletePassInput").focus(), 100);
        }

        $("commonDeleteCheck").addEventListener("change", function() {
            if (this.checked) {
                this.checked = false;
                openPasswordPrompt(null);
            } else {
                isDeleteUnlocked = false;
                pendingDeleteId = null;
                updateDeleteUI();
            }
        });

        $("deletePassInput").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                verifyDeletePassword();
            }
        });

        window.verifyDeletePassword = async function() {
            const entered = $("deletePassInput").value.trim();
            const errEl = $("passErrorMsg");
            const btn = $("verifyPassBtn");

            if (!entered) {
                errEl.textContent = "कृपया पासवर्ड डालें।";
                errEl.style.display = "block";
                return;
            }

            btn.disabled = true;
            btn.textContent = "जाँच हो रही है...";

            try {
                const snap = await getDoc(doc(db, "security", "config"));
                const savedPass = snap.exists() ? String(snap.data().deletePassword || "") : "";

                if (!savedPass) {
                    errEl.textContent = "अभी कोई Delete Password सेट नहीं है। पहले Dashboard → Password से पासवर्ड सेट करें।";
                    errEl.style.display = "block";
                } else if (entered === savedPass) {
                    isDeleteUnlocked = true;
                    $("passModal").style.display = "none";
                    updateDeleteUI();

                    if (pendingDeleteId) {
                        const idToDelete = pendingDeleteId;
                        pendingDeleteId = null;
                        openDeleteModal(idToDelete);
                    }
                } else {
                    errEl.textContent = "❌ गलत पासवर्ड!";
                    errEl.style.display = "block";
                }
            } catch (err) {
                console.error(err);
                errEl.textContent = "त्रुटि हुई: इंटरनेट या Firebase जाँचें।";
                errEl.style.display = "block";
            } finally {
                btn.disabled = false;
                btn.textContent = "Unlock Delete";
            }
        };

        window.closePassModal = function() {
            $("passModal").style.display = "none";
            pendingDeleteId = null;
            isDeleteUnlocked = false;
            updateDeleteUI();
        };

        window.addEventListener("beforeunload", () => {
            isDeleteUnlocked = false;
        });

        window.addEventListener("pagehide", () => {
            isDeleteUnlocked = false;
            updateDeleteUI();
        });

        /* =====================================================
           EXISTING APP FUNCTIONS
        ===================================================== */
        function cleanPhone(phone) {
            return String(phone || "").replace(/\s+/g, "").trim();
        }

        function escapeHTML(text) {
            return String(text || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }

        function getNotes() {
            let boxes = document.querySelectorAll(".noteBox");
            let notes = [];

            boxes.forEach(box => {
                let text = box.value.trim();
                if (text) notes.push(text);
            });

            return notes;
        }

        function resetNotes() {
            document.getElementById("noteContainer").innerHTML =
            `<textarea class="noteBox" placeholder="बकाया नोट 1"></textarea>`;
        }

        function clearForm() {
            document.getElementById("name").value = "";
            document.getElementById("phone1").value = "";
            document.getElementById("phone2").value = "";
            document.getElementById("phone2").style.display = "none";
            resetNotes();
        }

        document.getElementById("phone1").addEventListener("dblclick", ()=> {
            document.getElementById("phone2").style.display = "block";
        });

        document.getElementById("noteContainer").addEventListener("dblclick", function(e) {
            if (!e.target.classList.contains("noteBox")) return;

            let count = document.querySelectorAll(".noteBox").length + 1;
            let box = document.createElement("textarea");
            box.className = "noteBox";
            box.placeholder = "बकाया नोट " + count;

            document.getElementById("noteContainer").appendChild(box);
            box.focus();
        });

        function noteToHTML(note) {
            let lines = String(note)
            .split("\n")
            .map(t => t.trim())
            .filter(t => t);

            if (lines.length <= 1) {
                return `
                <div class="noteItem">
                <span class="bullet">•</span>
                <span class="noteText">${escapeHTML(note)}</span>
                </div>`;
            }

            return `
            <div class="noteItem">
            <span class="bullet">•</span>
            <div class="innerGrid">
            ${lines.map(t => `<span>${escapeHTML(t)}</span>`).join("")}
            </div>
            </div>`;
        }

        window.saveData = async function() {

            let name = document.getElementById("name").value.trim();
            let phone1 = document.getElementById("phone1").value.trim();
            let phone2 = document.getElementById("phone2").value.trim();
            let notes = getNotes();

            if (!name) {
                document.getElementById("name").focus();
                return;
            }

            await addDoc(colRef, {
                name: name,
                phone1: phone1,
                phone2: phone2,
                notes: notes,
                amount: notes.join("\n\n"),
                time: Date.now()
            });

            clearForm();
        }

        onSnapshot(colRef, (snap)=> {

            allData = [];

            snap.forEach(d => {
                allData.push({
                    id: d.id,
                    ...d.data()
                });
            });

            allData.sort((a, b)=>(a.time || 0) - (b.time || 0));

            render();

        });

        function render() {

            let html = "";
            const lockClass = isDeleteUnlocked ? "" : "delBtnLocked";

            allData.forEach((x, i)=> {

                let phone1Call = cleanPhone(x.phone1 || "");
                let phone2Call = cleanPhone(x.phone2 || "");

                let notes = [];

                if (Array.isArray(x.notes) && x.notes.length) {
                    notes = x.notes;
                } else if (x.amount) {
                    notes = String(x.amount).split("\n\n").filter(t => t.trim());
                }

                let detailHTML = notes.length ? notes.map(noteToHTML).join(""): "-";

                let showBtn = "";

                if (phone1Call || phone2Call) {
                    showBtn = `<span class="toggle" onclick="toggleNumber(${i})">Show</span>`;
                }

                html += `
                <div class="box">
                <div class="bottom">
                <div class="nameBox">
                👤 ${escapeHTML(x.name || "-")}
                ${showBtn}

                <div class="number" id="num${i}">
                ${phone1Call ? "📞 " + escapeHTML(phone1Call): ""}
                ${phone2Call ? "<br>📞 " + escapeHTML(phone2Call): ""}
                </div>
                </div>

                <div class="action">
                ${phone1Call ? `<a href="tel:${phone1Call}" class="call">📞 Call</a>`: ""}
                ${phone2Call ? `<a href="tel:${phone2Call}" class="call">📞 Call</a>`: ""}
                <button class="smallBtn edit" onclick="editData(${i})">Edit</button>
                <button class="smallBtn del delActionBtn ${lockClass}" onclick="deleteData('${x.id}')">Delete</button>
                </div>
                </div>

                <div class="detail">${detailHTML}</div>
                </div>`;
            });

            document.getElementById("list").innerHTML = html;
        }

        window.toggleNumber = function(i) {
            let el = document.getElementById("num"+i);
            el.style.display = el.style.display === "block" ? "none": "block";
        }

        window.editData = function(i) {

            let x = allData[i];

            editId = x.id;

            document.getElementById("name").value = x.name || "";
            document.getElementById("phone1").value = x.phone1 || "";
            document.getElementById("phone2").value = x.phone2 || "";
            document.getElementById("phone2").style.display = x.phone2 ? "block": "none";

            let notes = [];

            if (Array.isArray(x.notes) && x.notes.length) {
                notes = x.notes;
            } else if (x.amount) {
                notes = String(x.amount).split("\n\n").filter(t => t.trim());
            }

            if (notes.length === 0) notes = [""];

            document.getElementById("noteContainer").innerHTML = notes.map((n, idx)=> {
                return `<textarea class="noteBox" placeholder="बकाया नोट ${idx+1}">${escapeHTML(n)}</textarea>`;
            }).join("");

            document.getElementById("saveBtn").style.display = "none";
            document.getElementById("updateBtn").style.display = "block";
            document.getElementById("cancelBtn").style.display = "block";

            window.scrollTo({
                top: 0, behavior: "smooth"
            });
        }

        window.updateData = async function() {

            if (!editId) return;

            let name = document.getElementById("name").value.trim();
            let phone1 = document.getElementById("phone1").value.trim();
            let phone2 = document.getElementById("phone2").value.trim();
            let notes = getNotes();

            if (!name) {
                document.getElementById("name").focus();
                return;
            }

            await updateDoc(doc(db, "tdm", editId), {
                name: name,
                phone1: phone1,
                phone2: phone2,
                notes: notes,
                amount: notes.join("\n\n")
            });

            cancelEdit();
        }

        window.cancelEdit = function() {

            editId = null;
            clearForm();

            document.getElementById("saveBtn").style.display = "block";
            document.getElementById("updateBtn").style.display = "none";
            document.getElementById("cancelBtn").style.display = "none";
        }

        window.openDeleteModal = function(id) {
            deleteId = id;
            $("deleteModal").style.display = "block";
        };

        window.closeDeleteModal = function() {
            deleteId = null;
            $("deleteModal").style.display = "none";
        };

        window.confirmDelete = async function() {
            if (!isDeleteUnlocked) {
                $("deleteModal").style.display = "none";
                openPasswordPrompt(deleteId);
                return;
            }
            if (!deleteId) return;

            await deleteDoc(doc(db, "tdm", deleteId));
            closeDeleteModal();
        };

        window.deleteData = function(id) {
            if (!isDeleteUnlocked) {
                openPasswordPrompt(id);
                return;
            }
            openDeleteModal(id);
        }

        updateDeleteUI();

    </script>

</body>
</html>
