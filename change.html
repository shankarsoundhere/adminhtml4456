<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>नाम बदलें</title><style>

body{
    margin:0;
    padding:12px;
    font-family:Arial,sans-serif;
    background:#f8f9fa;
    color:#212529;
}

.box{
    width:100%;
    max-width:480px;
    margin:auto;
}

.changeBtn{

    width:100%;

    display:flex;

    align-items:center;

    gap:14px;

    padding:16px;

    margin:12px 0;

    box-sizing:border-box;

    background:white;

    border:1px solid #dee2e6;

    border-radius:12px;

    font-size:17px;

    color:#212529;

    cursor:pointer;

    text-align:left;

    box-shadow:none;

    transition:0.15s;

}

.icon{
    font-size:26px;
    width:35px;
    text-align:center;
}

.text{
    font-size:17px;
}

.changeBtn:active{
    transform:scale(0.98);
    background:#f1f3f6;
}

</style></head><body><div class="box"><!-- =========================
     LIGHT MISTRY
========================= --><button
class="changeBtn"
onclick="openLight()"

«»

<span class="icon">💡</span>

<span class="text">
लाइट मिस्त्री
</span></button><!-- =========================
     PANDAL MISTRY
========================= --><button
class="changeBtn"
onclick="openPandal()"

«»

<span class="icon">🏠</span>

<span class="text">
पंडाल मिस्त्री
</span></button></div><script>

function openLight(){

    window.location.href =
        "light-name.html?type=light";

}


function openPandal(){

    window.location.href =
        "pandal-name.html?type=pandal";

}

</script>
</body>
</html>
