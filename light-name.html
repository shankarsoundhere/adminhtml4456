<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>लाइट मिस्त्री नाम</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#28a745">

<link rel="icon" href="icon-192.png">

<link rel="apple-touch-icon"
href="icon-192.png">


<style>

/* =========================
   BODY
========================= */

body{
    margin:0;
    padding:10px;
    font-family:Arial,sans-serif;
    background:#f1f3f6;
}


/* =========================
   MAIN BOX
========================= */

.box{
    max-width:700px;
    margin:auto;
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}


/* =========================
   HEADING
========================= */

h2{
    text-align:center;
    margin-top:5px;
    margin-bottom:20px;
}


/* =========================
   SECTION TITLE
========================= */

.section-title{
    background:#28a745;
    color:white;
    padding:12px;
    border-radius:7px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin:10px 0 12px;
}


/* =========================
   COMMON EDIT / DELETE TICK BAR
========================= */

.security-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#fff3cd;
    border:1px solid #ffeeba;
    padding:10px 12px;
    border-radius:7px;
    margin-bottom:12px;
    font-size:14px;
    font-weight:bold;
    color:#856404;
}

.security-bar.unlocked{
    background:#f8d7da;
    border-color:#f5c6cb;
    color:#721c24;
}

.security-label{
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    user-select:none;
    margin:0;
}

.security-label input[type="checkbox"]{
    width:18px;
    height:18px;
    margin:0;
    cursor:pointer;
}

.actionBtnLocked{
    opacity:0.45;
}


/* =========================
   ROW
========================= */

.row{
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    margin-bottom:10px;
    background:#fafafa;
}


/* =========================
   SLOT TITLE
========================= */

.slot{
    font-weight:bold;
    margin-bottom:8px;
}


/* =========================
   INPUT
========================= */

input{
    width:100%;
    padding:10px;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
    margin-bottom:8px;
}


/* =========================
   BUTTON
========================= */

button{
    padding:9px 12px;
    margin-right:5px;
    border:none;
    border-radius:5px;
    color:white;
    cursor:pointer;
    font-size:14px;
}


/* =========================
   EDIT
========================= */

.editBtn{
    background:#007bff;
}


/* =========================
   SAVE
========================= */

.saveBtn{
    background:#28a745;
}


/* =========================
   DELETE
========================= */

.deleteBtn{
    background:#dc3545;
}


/* =========================
   DISABLED
========================= */

button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}


/* =========================
   PLUS BUTTON
========================= */

.addBtn{
    width:100%;
    padding:13px;
    margin-top:5px;
    margin-right:0;
    background:#28a745;
    color:white;
    font-size:17px;
    font-weight:bold;
    border-radius:7px;
}


.addBtn:hover{
    background:#218838;
}


/* =========================
   CUSTOM MODAL & TOAST
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    z-index:9999;
    padding:15px;
}

.modal-content{
    background:white;
    width:100%;
    max-width:380px;
    margin:100px auto;
    padding:18px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 6px 20px rgba(0,0,0,0.2);
}

.modal-content h3{
    margin:0 0 8px 0;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.modal-actions button{
    flex:1;
    margin:0;
    padding:11px;
    font-size:15px;
    font-weight:bold;
}

#toastMsg{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    background:#222;
    color:white;
    padding:11px 18px;
    border-radius:10px;
    font-size:14px;
    z-index:99999;
    display:none;
    box-shadow:0 3px 12px rgba(0,0,0,0.25);
    text-align:center;
    max-width:90%;
}

</style>

</head>


<body>


<div class="box">


    <!-- =========================
         MAIN HEADING
    ========================== -->

    <h2>
        💡 नाम करण
    </h2>


    <!-- =========================
         SECTION TITLE
    ========================== -->

    <div class="section-title">
        💡 लाइट मिस्त्री
    </div>


    <!-- =========================
         COMMON EDIT / DELETE SECURITY TICK
    ========================== -->

    <div class="security-bar" id="securityBar">
        <label class="security-label">
            <input type="checkbox" id="commonDeleteTick">
            <span>Common Edit / Delete Mode</span>
        </label>
        <span id="securityStatus">🔒 OFF</span>
    </div>


    <!-- =========================
         ALL SLOTS WILL COME HERE
    ========================== -->

    <div id="lightList"></div>


    <!-- =========================
         PLUS BUTTON
    ========================== -->

    <button
        class="addBtn"
        id="addSlotBtn"
    >
        ➕ नया Slot जोड़ें
    </button>


</div>


<!-- ==================================================
     COMMON PASSWORD MODAL
================================================== -->

<div class="modal" id="passModal">
    <div class="modal-content">
        <h3>🔐 Security Password</h3>
        <p style="font-size:14px; color:#444; margin:6px 0;">Edit / Delete चालू करने के लिए पासवर्ड डालें:</p>
        <input type="password" id="deletePassInput" placeholder="पासवर्ड डालें" autocomplete="off">
        <p id="passErrorMsg" style="color:#dc3545; font-size:13px; display:none; margin:5px 0;"></p>
        <div class="modal-actions">
            <button class="editBtn" id="verifyPassBtn">Unlock</button>
            <button class="deleteBtn" id="closePassBtn">Cancel</button>
        </div>
    </div>
</div>


<!-- ==================================================
     CONFIRM DELETE MODAL
================================================== -->

<div class="modal" id="deleteModal">
    <div class="modal-content">
        <h3>Delete करना है?</h3>
        <p id="deleteConfirmText" style="font-size:14px; color:#444; margin:8px 0;"></p>
        <div class="modal-actions">
            <button class="deleteBtn" id="confirmDeleteBtn">🗑️ Delete</button>
            <button class="editBtn" id="cancelDeleteBtn">Cancel</button>
        </div>
    </div>
</div>


<div id="toastMsg"></div>


<script type="module">


/* =====================================================
   FIREBASE IMPORT
===================================================== */

import {

    db,
    collection,
    onSnapshot,
    doc,
    updateDoc,
    deleteDoc,
    getDoc,
    setDoc

} from "./firebase.js";



/* =====================================================
   COMMON PASSWORD & EDIT / DELETE SECURITY SYSTEM
===================================================== */

let isActionUnlocked = false;
let pendingAction = null;
let targetDeleteSlot = null;

const commonTick = document.getElementById("commonDeleteTick");
const securityBar = document.getElementById("securityBar");
const securityStatus = document.getElementById("securityStatus");

function showToast(msg){
    const box = document.getElementById("toastMsg");
    box.textContent = msg;
    box.style.display = "block";
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => {
        box.style.display = "none";
    }, 2400);
}

function updateSecurityUI(){
    commonTick.checked = isActionUnlocked;
    if(isActionUnlocked){
        securityBar.classList.add("unlocked");
        securityStatus.textContent = "🔓 ON";
    } else {
        securityBar.classList.remove("unlocked");
        securityStatus.textContent = "🔒 OFF";
    }

    document.querySelectorAll(".secActionBtn").forEach(btn => {
        if(isActionUnlocked){
            btn.classList.remove("actionBtnLocked");
        } else {
            btn.classList.add("actionBtnLocked");
        }
    });
}

function openPasswordPrompt(actionObj = null){
    pendingAction = actionObj;
    document.getElementById("deletePassInput").value = "";
    document.getElementById("passErrorMsg").style.display = "none";
    document.getElementById("passModal").style.display = "block";
    setTimeout(() => document.getElementById("deletePassInput").focus(), 100);
}

async function verifyDeletePassword(){
    const enteredPass = document.getElementById("deletePassInput").value.trim();
    const errEl = document.getElementById("passErrorMsg");
    const btn = document.getElementById("verifyPassBtn");

    if(!enteredPass){
        errEl.textContent = "कृपया पासवर्ड डालें।";
        errEl.style.display = "block";
        return;
    }

    btn.disabled = true;
    btn.textContent = "जाँच हो रही है...";

    try{
        const passDocRef = doc(db, "security", "config");
        const passSnap = await getDoc(passDocRef);

        if(!passSnap.exists() || !passSnap.data().deletePassword){
            errEl.textContent = "अभी कोई Password सेट नहीं है। पहले Dashboard → Password से पासवर्ड सेट करें।";
            errEl.style.display = "block";
        } else {
            const realPassword = String(passSnap.data().deletePassword);
            if(enteredPass === realPassword){
                isActionUnlocked = true;
                document.getElementById("passModal").style.display = "none";
                updateSecurityUI();

                if(pendingAction){
                    const act = pendingAction;
                    pendingAction = null;
                    if(act.type === "delete"){
                        openDeleteConfirmModal(act.slot);
                    } else if(act.type === "edit"){
                        editName(act.slot);
                    }
                }
            } else {
                errEl.textContent = "❌ गलत पासवर्ड!";
                errEl.style.display = "block";
            }
        }
    } catch(err){
        console.error("Password Verification Error:", err);
        errEl.textContent = "त्रुटि हुई: इंटरनेट या Firebase जांचें।";
        errEl.style.display = "block";
    } finally {
        btn.disabled = false;
        btn.textContent = "Unlock";
    }
}

function closePassModal(){
    document.getElementById("passModal").style.display = "none";
    pendingAction = null;
    isActionUnlocked = false;
    updateSecurityUI();
}

document.getElementById("verifyPassBtn").addEventListener("click", verifyDeletePassword);
document.getElementById("closePassBtn").addEventListener("click", closePassModal);
document.getElementById("deletePassInput").addEventListener("keypress", function(e){
    if(e.key === "Enter") verifyDeletePassword();
});

/* Tick ON/OFF हैंडलर */
commonTick.addEventListener("change", function(){
    if(commonTick.checked){
        commonTick.checked = false;
        openPasswordPrompt(null);
    } else {
        isActionUnlocked = false;
        pendingAction = null;
        updateSecurityUI();
    }
});

/* पेज छोड़ते ही Tick अपने आप OFF हो जाए */
function resetSecurityOnLeave(){
    isActionUnlocked = false;
    pendingAction = null;
    if(commonTick) commonTick.checked = false;
    updateSecurityUI();
}

window.addEventListener("pagehide", resetSecurityOnLeave);
window.addEventListener("beforeunload", resetSecurityOnLeave);
window.addEventListener("pageshow", resetSecurityOnLeave);



/* =====================================================
   FIREBASE COLLECTION
===================================================== */

const colRef =
    collection(
        db,
        "light_names"
    );



/* =====================================================
   VARIABLES
===================================================== */

let maxSlot = 10;
const editingSlots = new Set();



/* =====================================================
   HTML SAFE FUNCTION
===================================================== */

function escapeHtml(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}



/* =====================================================
   CREATE SLOT
===================================================== */

function createSlot(
    slot,
    name = ""
){

    if(
        document.getElementById(
            "row-"+slot
        )
    ){

        return;

    }


    const list =
        document.getElementById(
            "lightList"
        );


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "row";


    row.id =
        "row-"+slot;


    const lockClass = isActionUnlocked ? "" : "actionBtnLocked";


    row.innerHTML = `

        <div class="slot">
            💡 Slot ${slot}
        </div>


        <input
            id="light-name-${slot}"
            type="text"
            placeholder="नाम दर्ज करें"
            value="${escapeHtml(name)}"
            disabled
        >


        <button
            class="editBtn secActionBtn ${lockClass}"
            id="light-edit-${slot}"
        >
            ✏️ Edit
        </button>


        <button
            class="saveBtn"
            id="light-save-${slot}"
            disabled
        >
            💾 Save
        </button>


        <button
            class="deleteBtn secActionBtn ${lockClass}"
            id="light-delete-${slot}"
        >
            🗑️ Delete
        </button>

    `;


    list.appendChild(row);


    document.getElementById(
        "light-edit-"+slot
    ).addEventListener(
        "click",
        function(){

            editName(slot);

        }
    );


    document.getElementById(
        "light-save-"+slot
    ).addEventListener(
        "click",
        function(){

            saveName(slot);

        }
    );


    document.getElementById(
        "light-delete-"+slot
    ).addEventListener(
        "click",
        function(){

            deleteName(slot);

        }
    );

}



/* =====================================================
   CREATE FIRST 10 SLOTS
===================================================== */

for(
    let i = 1;
    i <= 10;
    i++
){

    createSlot(i);

}



/* =====================================================
   PLUS BUTTON
===================================================== */

document.getElementById(
    "addSlotBtn"
).addEventListener(
    "click",
    function(){

        maxSlot++;

        createSlot(
            maxSlot
        );

        activateEditInput(
            maxSlot
        );

        setTimeout(
            function(){

                const row =
                    document.getElementById(
                        "row-"+maxSlot
                    );

                if(row){

                    row.scrollIntoView({

                        behavior:"smooth",

                        block:"center"

                    });

                }

            },
            100
        );

    }
);



/* =====================================================
   EDIT NAME
===================================================== */

function activateEditInput(slot){
    const input = document.getElementById("light-name-"+slot);
    const editBtn = document.getElementById("light-edit-"+slot);
    const saveBtn = document.getElementById("light-save-"+slot);

    if(!input) return;

    input.disabled = false;
    input.focus();

    editBtn.disabled = true;
    saveBtn.disabled = false;

    editingSlots.add(slot);
}

function editName(slot){
    const input = document.getElementById("light-name-"+slot);
    if(!input) return;

    /* यदि स्लॉट में पहले से नाम है और Security OFF है तो पासवर्ड मांगें */
    if(input.value.trim() !== "" && !isActionUnlocked){
        openPasswordPrompt({ type: "edit", slot });
        return;
    }

    activateEditInput(slot);
}



/* =====================================================
   SAVE NAME
===================================================== */

async function saveName(slot){

    const input =
        document.getElementById(
            "light-name-"+slot
        );

    if(!input)
        return;

    const name =
        input.value.trim();

    if(name === ""){

        showToast("नाम खाली नहीं हो सकता।");
        input.focus();
        return;

    }

    try{

        const nameRef =
            doc(
                db,
                "light_names",
                String(slot)
            );

        const oldData =
            await getDoc(
                nameRef
            );

        if(
            oldData.exists()
        ){

            await updateDoc(

                nameRef,

                {

                    name:name,

                    slot:slot,

                    time:Date.now()

                }

            );

        }

        else{

            await setDoc(

                nameRef,

                {

                    name:name,

                    slot:slot,

                    time:Date.now()

                }

            );

        }

        input.disabled =
            true;

        document.getElementById(
            "light-edit-"+slot
        ).disabled =
            false;

        document.getElementById(
            "light-save-"+slot
        ).disabled =
            true;

        editingSlots.delete(
            slot
        );

        showToast("✅ नाम Save हो गया");

    }

    catch(error){

        console.error(
            "Save Error:",
            error
        );

        showToast("❌ नाम Save नहीं हुआ।");

    }

}



/* =====================================================
   DELETE NAME (WITH COMMON SECURITY SYSTEM)
===================================================== */

function openDeleteConfirmModal(slot){
    targetDeleteSlot = slot;
    document.getElementById("deleteConfirmText").textContent =
        "लाइट मिस्त्री Slot " + slot + " का नाम Delete करना है?";
    document.getElementById("deleteModal").style.display = "block";
}

function closeDeleteConfirmModal(){
    targetDeleteSlot = null;
    document.getElementById("deleteModal").style.display = "none";
}

document.getElementById("cancelDeleteBtn").addEventListener("click", closeDeleteConfirmModal);

document.getElementById("confirmDeleteBtn").addEventListener("click", async function(){
    if(!isActionUnlocked){
        closeDeleteConfirmModal();
        openPasswordPrompt({ type: "delete", slot: targetDeleteSlot });
        return;
    }

    if(targetDeleteSlot === null)
        return;

    const slot = targetDeleteSlot;
    closeDeleteConfirmModal();

    try{

        await deleteDoc(

            doc(
                db,
                "light_names",
                String(slot)
            )

        );

        const input =
            document.getElementById(
                "light-name-"+slot
            );

        if(input){

            input.value =
                "";

            input.disabled =
                true;

        }

        const editBtn =
            document.getElementById(
                "light-edit-"+slot
            );

        const saveBtn =
            document.getElementById(
                "light-save-"+slot
            );

        if(editBtn){

            editBtn.disabled =
                false;

        }

        if(saveBtn){

            saveBtn.disabled =
                true;

        }

        editingSlots.delete(
            slot
        );

        showToast("🗑️ नाम Delete हो गया");

    }

    catch(error){

        console.error(
            "Delete Error:",
            error
        );

        showToast("❌ नाम Delete नहीं हुआ।");

    }
});

function deleteName(slot){

    if(!isActionUnlocked){
        openPasswordPrompt({ type: "delete", slot });
        return;
    }

    openDeleteConfirmModal(slot);

}



/* =====================================================
   FIREBASE REALTIME LISTENER
===================================================== */

onSnapshot(

    colRef,

    function(snapshot){

        snapshot.forEach(
            function(item){

                const slot =
                    Number(
                        item.id
                    );

                if(
                    !Number.isInteger(slot)
                    ||
                    slot < 1
                ){

                    return;

                }

                if(
                    slot > maxSlot
                ){

                    maxSlot =
                        slot;

                }

                const data =
                    item.data();

                createSlot(

                    slot,

                    data.name || ""

                );

                const input =
                    document.getElementById(
                        "light-name-"+slot
                    );

                if(!input)
                    return;

                if(
                    !editingSlots.has(slot)
                ){

                    input.value =
                        data.name || "";

                }

            }
        );

        for(
            let i = 1;
            i <= maxSlot;
            i++
        ){

            const row =
                document.getElementById(
                    "row-"+i
                );

            const input =
                document.getElementById(
                    "light-name-"+i
                );

            if(
                row &&
                input &&
                !editingSlots.has(i)
            ){

                const exists =
                    snapshot.docs.some(
                        function(item){

                            return Number(
                                item.id
                            ) === i;

                        }
                    );

                if(!exists){

                    input.value =
                        "";

                }

            }

        }

    },


    function(error){

        console.error(
            "Firebase Error:",
            error
        );

    }

);

updateSecurityUI();

</script>


<!-- =========================
     PWA
========================= -->

<script src="pwa.js"></script>


</body>

</html>
