<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>लाइट मिस्त्री नाम</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#28a745">

<link rel="icon" href="icon-192.png">

<link rel="apple-touch-icon"
href="icon-192.png">


<style>

/* =========================
   BODY
========================= */

body{
    margin:0;
    padding:10px;
    font-family:Arial,sans-serif;
    background:#f1f3f6;
}


/* =========================
   MAIN BOX
========================= */

.box{
    max-width:700px;
    margin:auto;
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}


/* =========================
   HEADING
========================= */

h2{
    text-align:center;
    margin-top:5px;
    margin-bottom:20px;
}


/* =========================
   SECTION TITLE
========================= */

.section-title{
    background:#28a745;
    color:white;
    padding:12px;
    border-radius:7px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin:10px 0 12px;
}


/* =========================
   ROW
========================= */

.row{
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    margin-bottom:10px;
    background:#fafafa;
}


/* =========================
   SLOT TITLE
========================= */

.slot{
    font-weight:bold;
    margin-bottom:8px;
}


/* =========================
   INPUT
========================= */

input{
    width:100%;
    padding:10px;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
    margin-bottom:8px;
}


/* =========================
   BUTTON
========================= */

button{
    padding:9px 12px;
    margin-right:5px;
    border:none;
    border-radius:5px;
    color:white;
    cursor:pointer;
    font-size:14px;
}


/* =========================
   EDIT
========================= */

.editBtn{
    background:#007bff;
}


/* =========================
   SAVE
========================= */

.saveBtn{
    background:#28a745;
}


/* =========================
   DELETE
========================= */

.deleteBtn{
    background:#dc3545;
}


/* =========================
   DISABLED
========================= */

button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}


/* =========================
   PLUS BUTTON
========================= */

.addBtn{
    width:100%;
    padding:13px;
    margin-top:5px;
    margin-right:0;
    background:#28a745;
    color:white;
    font-size:17px;
    font-weight:bold;
    border-radius:7px;
}


.addBtn:hover{
    background:#218838;
}


/* =========================
   EMPTY MESSAGE
========================= */

.empty{
    text-align:center;
    color:#777;
    padding:15px;
}

</style>

</head>


<body>


<div class="box">


    <!-- =========================
         MAIN HEADING
    ========================== -->

    <h2>
        💡 नाम करण
    </h2>


    <!-- =========================
         SECTION TITLE
    ========================== -->

    <div class="section-title">
        💡 लाइट मिस्त्री
    </div>


    <!-- =========================
         ALL SLOTS WILL COME HERE
    ========================== -->

    <div id="lightList"></div>


    <!-- =========================
         PLUS BUTTON
    ========================== -->

    <button
        class="addBtn"
        id="addSlotBtn"
    >
        ➕ नया Slot जोड़ें
    </button>


</div>



<script type="module">


/* =====================================================
   FIREBASE IMPORT
===================================================== */

import {

    db,
    collection,
    onSnapshot,
    doc,
    updateDoc,
    deleteDoc,
    getDoc,
    setDoc

} from "./firebase.js";



/* =====================================================
   FIREBASE COLLECTION
===================================================== */

const colRef =
    collection(
        db,
        "light_names"
    );



/* =====================================================
   VARIABLES
===================================================== */


/*
   कम से कम 10 slots दिखाई देंगे।
   उसके बाद Plus से बढ़ेंगे।
*/

let maxSlot = 10;



/*
   यह पता रखेगा कि कौन-सा slot
   अभी edit mode में है।
*/

const editingSlots = new Set();



/* =====================================================
   HTML SAFE FUNCTION
===================================================== */

function escapeHtml(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}



/* =====================================================
   CREATE SLOT
===================================================== */

function createSlot(
    slot,
    name = ""
){

    /*
       अगर यह slot पहले से बना हुआ है
       तो दोबारा create नहीं करेंगे।
    */

    if(
        document.getElementById(
            "row-"+slot
        )
    ){

        return;

    }



    const list =
        document.getElementById(
            "lightList"
        );



    /*
       Row बनाना
    */

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "row";


    row.id =
        "row-"+slot;



    /*
       Row HTML
    */

    row.innerHTML = `

        <div class="slot">
            💡 Slot ${slot}
        </div>


        <input
            id="light-name-${slot}"
            type="text"
            placeholder="नाम दर्ज करें"
            value="${escapeHtml(name)}"
            disabled
        >


        <button
            class="editBtn"
            id="light-edit-${slot}"
        >
            ✏️ Edit
        </button>


        <button
            class="saveBtn"
            id="light-save-${slot}"
            disabled
        >
            💾 Save
        </button>


        <button
            class="deleteBtn"
            id="light-delete-${slot}"
        >
            🗑️ Delete
        </button>

    `;



    /*
       List में जोड़ना
    */

    list.appendChild(row);



    /* =================================================
       EDIT BUTTON
    ================================================= */

    document.getElementById(
        "light-edit-"+slot
    ).addEventListener(
        "click",
        function(){

            editName(slot);

        }
    );



    /* =================================================
       SAVE BUTTON
    ================================================= */

    document.getElementById(
        "light-save-"+slot
    ).addEventListener(
        "click",
        function(){

            saveName(slot);

        }
    );



    /* =================================================
       DELETE BUTTON
    ================================================= */

    document.getElementById(
        "light-delete-"+slot
    ).addEventListener(
        "click",
        function(){

            deleteName(slot);

        }
    );

}



/* =====================================================
   CREATE FIRST 10 SLOTS
===================================================== */

for(
    let i = 1;
    i <= 10;
    i++
){

    createSlot(i);

}



/* =====================================================
   PLUS BUTTON
===================================================== */

document.getElementById(
    "addSlotBtn"
).addEventListener(
    "click",
    function(){

        /*
           अगला slot
        */

        maxSlot++;



        /*
           नया slot बनाएं
        */

        createSlot(
            maxSlot
        );



        /*
           नया slot automatically
           Edit mode में खोलें
        */

        editName(
            maxSlot
        );



        /*
           नए slot तक scroll करें
        */

        setTimeout(
            function(){

                const row =
                    document.getElementById(
                        "row-"+maxSlot
                    );


                if(row){

                    row.scrollIntoView({

                        behavior:"smooth",

                        block:"center"

                    });

                }

            },
            100
        );

    }
);



/* =====================================================
   EDIT NAME
===================================================== */

function editName(slot){

    const input =
        document.getElementById(
            "light-name-"+slot
        );


    const editBtn =
        document.getElementById(
            "light-edit-"+slot
        );


    const saveBtn =
        document.getElementById(
            "light-save-"+slot
        );



    if(!input)
        return;



    /*
       Edit mode
    */

    input.disabled =
        false;


    input.focus();



    /*
       Buttons
    */

    editBtn.disabled =
        true;


    saveBtn.disabled =
        false;



    /*
       Editing list में डालें
    */

    editingSlots.add(
        slot
    );

}



/* =====================================================
   SAVE NAME
===================================================== */

async function saveName(slot){

    const input =
        document.getElementById(
            "light-name-"+slot
        );


    if(!input)
        return;



    const name =
        input.value.trim();



    /*
       खाली नाम
    */

    if(name === ""){

        alert(
            "नाम खाली नहीं हो सकता।"
        );


        input.focus();


        return;

    }



    try{

        /*
           Firebase document
        */

        const nameRef =
            doc(
                db,
                "light_names",
                String(slot)
            );



        /*
           Check existing document
        */

        const oldData =
            await getDoc(
                nameRef
            );



        /*
           Existing document
        */

        if(
            oldData.exists()
        ){

            await updateDoc(

                nameRef,

                {

                    name:name,

                    slot:slot,

                    time:Date.now()

                }

            );

        }


        /*
           New document
        */

        else{

            await setDoc(

                nameRef,

                {

                    name:name,

                    slot:slot,

                    time:Date.now()

                }

            );

        }



        /*
           Input lock
        */

        input.disabled =
            true;



        /*
           Buttons वापस normal
        */

        document.getElementById(
            "light-edit-"+slot
        ).disabled =
            false;


        document.getElementById(
            "light-save-"+slot
        ).disabled =
            true;



        /*
           Editing list से हटाएं
        */

        editingSlots.delete(
            slot
        );



    }

    catch(error){

        console.error(
            "Save Error:",
            error
        );


        alert(
            "नाम Save नहीं हुआ। Firebase Error देखें।"
        );

    }

}



/* =====================================================
   DELETE NAME
===================================================== */

async function deleteName(slot){

    /*
       Confirmation
    */

    const yes =
        confirm(

            "लाइट मिस्त्री Slot "
            +
            slot
            +
            " का नाम Delete करना है?"

        );



    if(!yes)
        return;



    try{

        /*
           Firebase document delete
        */

        await deleteDoc(

            doc(
                db,
                "light_names",
                String(slot)
            )

        );



        /*
           Input खाली करें
        */

        const input =
            document.getElementById(
                "light-name-"+slot
            );


        if(input){

            input.value =
                "";


            input.disabled =
                true;

        }



        /*
           Buttons reset
        */

        const editBtn =
            document.getElementById(
                "light-edit-"+slot
            );


        const saveBtn =
            document.getElementById(
                "light-save-"+slot
            );


        if(editBtn){

            editBtn.disabled =
                false;

        }


        if(saveBtn){

            saveBtn.disabled =
                true;

        }



        /*
           Editing से हटाएं
        */

        editingSlots.delete(
            slot
        );



    }

    catch(error){

        console.error(
            "Delete Error:",
            error
        );


        alert(
            "नाम Delete नहीं हुआ।"
        );

    }

}



/* =====================================================
   FIREBASE REALTIME LISTENER
===================================================== */

onSnapshot(

    colRef,

    function(snapshot){

        /*
           Firebase में जितने documents हैं,
           उनके अनुसार slots बनाएं।
        */

        snapshot.forEach(
            function(item){

                const slot =
                    Number(
                        item.id
                    );


                /*
                   Invalid slot ignore
                */

                if(
                    !Number.isInteger(slot)
                    ||
                    slot < 1
                ){

                    return;

                }



                /*
                   maxSlot update
                */

                if(
                    slot > maxSlot
                ){

                    maxSlot =
                        slot;

                }



                /*
                   Firebase data
                */

                const data =
                    item.data();



                /*
                   अगर slot HTML में नहीं है
                   तो create करें
                */

                createSlot(

                    slot,

                    data.name || ""

                );



                /*
                   Input
                */

                const input =
                    document.getElementById(
                        "light-name-"+slot
                    );


                if(!input)
                    return;



                /*
                   अगर अभी edit नहीं हो रहा है
                   तो Firebase का नाम दिखाएं
                */

                if(
                    !editingSlots.has(slot)
                ){

                    input.value =
                        data.name || "";

                }

            }
        );



        /*
           Firebase में document delete होने पर
           UI से नाम हटाएं।
        */

        for(
            let i = 1;
            i <= maxSlot;
            i++
        ){

            const row =
                document.getElementById(
                    "row-"+i
                );


            const input =
                document.getElementById(
                    "light-name-"+i
                );


            /*
               अगर edit नहीं हो रहा
               और Firebase में document नहीं है
               तो खाली रखें।
            */

            if(
                row &&
                input &&
                !editingSlots.has(i)
            ){

                const exists =
                    snapshot.docs.some(
                        function(item){

                            return Number(
                                item.id
                            ) === i;

                        }
                    );


                if(!exists){

                    input.value =
                        "";

                }

            }

        }

    },


    function(error){

        console.error(
            "Firebase Error:",
            error
        );


        console.error(
            "Firebase realtime listener error."
        );

    }

);

</script>


<!-- =========================
     PWA
========================= -->

<script src="pwa.js"></script>


</body>

</html>
