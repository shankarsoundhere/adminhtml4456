<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jharkila Labour</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#28a745">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
body{font-family:Arial;background:#f1f3f6;padding:10px;}
.box{max-width:1100px;margin:auto;background:white;padding:15px;border-radius:10px;}

input,button,textarea{
width:100%;
padding:10px;
margin:5px 0;
box-sizing:border-box;
}

button{
background:#28a745;
color:white;
border:none;
cursor:pointer;
border-radius:5px;
}

.tableWrap{
width:100%;
overflow-x:auto;
margin-top:10px;
}

table{
min-width:900px;
width:100%;
border-collapse:collapse;
table-layout:fixed;
text-align:center;
}

td,th{
border:1px solid #000;
padding:8px 6px;
vertical-align:middle;
word-wrap:break-word;
}

.actionBtn{
width:32px !important;
height:28px;
padding:0 !important;
margin:1px;
font-size:13px;
}

.noteText{
white-space:normal;
text-align:left;
}

.popup{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.5);
justify-content:center;
align-items:center;
z-index:999;
}

.popup-box{
background:white;
padding:15px;
border-radius:10px;
width:90%;
max-width:400px;
}

@media print{
    body{
        background:white;
        padding:0;
        margin:0;
    }

    .box{
        max-width:100%;
        margin:0;
        padding:0;
        border-radius:0;
        background:white;
    }

    h2,
    h3,
    input,
    textarea,
    button,
    .popup{
        display:none !important;
    }

    .tableWrap{
        overflow:visible !important;
        margin:0 0 15px 0;
    }

    table{
        width:100% !important;
        min-width:0 !important;
        border-collapse:collapse;
        table-layout:fixed;
        page-break-inside:auto;
    }

    th,td{
        border:1px solid #000;
        padding:5px;
        font-size:12px;
        color:black;
        word-wrap:break-word;
    }

    tr{
        page-break-inside:avoid;
        page-break-after:auto;
    }

    th:last-child,
    td:last-child{
        display:none !important;
    }
}
</style>
</head>

<body>

<div class="box">

<h2>झारकिला लेबर</h2>

<input id="date" placeholder="दिनांक">

<input id="n1" placeholder="नाम 1">
<input id="n2" placeholder="नाम 2">
<input id="n3" placeholder="नाम 3">
<input id="n4" placeholder="नाम 4">
<input id="n5" placeholder="नाम 5">
<input id="n6" placeholder="नाम 6">

<textarea id="noteInput" placeholder="नोट"></textarea>

<button onclick="saveData()">💾 Save</button>
<button onclick="printData()">🖨️ Print</button>

<div class="tableWrap">
<table>
<thead>
<tr>
<th>दिनांक</th>
<th>1</th>
<th>2</th>
<th>3</th>
<th>4</th>
<th>5</th>
<th>6</th>
<th>Action</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<h3>नोट पॉइंट</h3>

<div class="tableWrap">
<table>
<thead>
<tr>
<th>नोट</th>
<th>Action</th>
</tr>
</thead>
<tbody id="noteBody"></tbody>
</table>
</div>

</div>

<div class="popup" id="editPopup">
<div class="popup-box">
<h3>Edit</h3>
<input id="e_date" placeholder="दिनांक">
<input id="e1" placeholder="नाम 1">
<input id="e2" placeholder="नाम 2">
<input id="e3" placeholder="नाम 3">
<input id="e4" placeholder="नाम 4">
<input id="e5" placeholder="नाम 5">
<input id="e6" placeholder="नाम 6">
<button onclick="updateData()">Update</button>
<button onclick="closePopup()">Cancel</button>
</div>
</div>

<div class="popup" id="notePopup">
<div class="popup-box">
<h3>Edit Note</h3>
<textarea id="editNote" placeholder="नोट"></textarea>
<button onclick="updateNote()">Update</button>
<button onclick="closeNotePopup()">Cancel</button>
</div>
</div>

<script type="module">
import {
db,
collection,
addDoc,
onSnapshot,
deleteDoc,
doc,
updateDoc,
getDoc
} from "./firebase.js";

let editId=null;
let noteEditId=null;

function sortDate(d){
    let p=(d||"").split("-");
    if(p.length!==3) return 0;

    let dd=p[0].padStart(2,"0");
    let mm=p[1].padStart(2,"0");
    let yy=p[2];

    if(yy.length===2){
        yy="20"+yy;
    }

    return Number(yy+mm+dd);
}

window.saveData=async()=>{
let note=noteInput.value.trim();

if(!date.value && !note){
alert("दिनांक या नोट डालो");
return;
}

if(date.value){
await addDoc(collection(db,"jharkila"),{
date:date.value,
n1:n1.value,
n2:n2.value,
n3:n3.value,
n4:n4.value,
n5:n5.value,
n6:n6.value
});
}

if(note){
await addDoc(collection(db,"jharkila_note"),{
text:note
});
}

alert("Saved");

date.value="";
n1.value="";
n2.value="";
n3.value="";
n4.value="";
n5.value="";
n6.value="";
noteInput.value="";
};

onSnapshot(collection(db,"jharkila"),snap=>{
tbody.innerHTML="";

let arr=[];

snap.forEach(d=>{
let x=d.data();

arr.push({
id:d.id,
date:x.date||"",
n1:x.n1||"",
n2:x.n2||"",
n3:x.n3||"",
n4:x.n4||"",
n5:x.n5||"",
n6:x.n6||""
});
});

arr.sort((a,b)=>sortDate(a.date)-sortDate(b.date));

arr.forEach(x=>{
tbody.innerHTML+=`
<tr>
<td>${x.date}</td>
<td>${x.n1}</td>
<td>${x.n2}</td>
<td>${x.n3}</td>
<td>${x.n4}</td>
<td>${x.n5}</td>
<td>${x.n6}</td>
<td>
<button class="actionBtn" onclick="editData('${x.id}')">✏️</button>
<button class="actionBtn" onclick="deleteData('${x.id}')">🗑️</button>
</td>
</tr>`;
});
});

onSnapshot(collection(db,"jharkila_note"),snap=>{
noteBody.innerHTML="";
snap.forEach(d=>{
let n=d.data();
noteBody.innerHTML+=`
<tr>
<td class="noteText">${n.text||""}</td>
<td>
<button class="actionBtn" onclick="editNoteData('${d.id}')">✏️</button>
<button class="actionBtn" onclick="deleteNote('${d.id}')">🗑️</button>
</td>
</tr>`;
});
});

window.deleteData=async(id)=>{
if(confirm("Delete करना है?")){
await deleteDoc(doc(db,"jharkila",id));
}
}

window.deleteNote=async(id)=>{
if(confirm("Note delete करना है?")){
await deleteDoc(doc(db,"jharkila_note",id));
}
}

window.editData=async(id)=>{
let snap=await getDoc(doc(db,"jharkila",id));

if(!snap.exists()){
alert("Data नहीं मिला");
return;
}

let x=snap.data();

e_date.value=x.date||"";
e1.value=x.n1||"";
e2.value=x.n2||"";
e3.value=x.n3||"";
e4.value=x.n4||"";
e5.value=x.n5||"";
e6.value=x.n6||"";

editId=id;
editPopup.style.display="flex";
}

window.updateData=async()=>{
await updateDoc(doc(db,"jharkila",editId),{
date:e_date.value,
n1:e1.value,
n2:e2.value,
n3:e3.value,
n4:e4.value,
n5:e5.value,
n6:e6.value
});

alert("Updated");
closePopup();
}

window.closePopup=()=>{
editPopup.style.display="none";
editId=null;
}

window.editNoteData=async(id)=>{
let snap=await getDoc(doc(db,"jharkila_note",id));

if(!snap.exists()){
alert("Note नहीं मिला");
return;
}

let n=snap.data();

editNote.value=n.text||"";
noteEditId=id;
notePopup.style.display="flex";
}

window.updateNote=async()=>{
await updateDoc(doc(db,"jharkila_note",noteEditId),{
text:editNote.value
});

alert("Note Updated");
closeNotePopup();
}

window.closeNotePopup=()=>{
notePopup.style.display="none";
noteEditId=null;
}

window.printData=()=>window.print();
</script>

<script src="pwa.js"></script>

</body>
</html>
