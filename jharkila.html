<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jharkila Labour</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#28a745">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
body{font-family:Arial;background:#dcdde1;padding:15px;margin:0;}

.box{
width:210mm;
min-height:297mm;
max-width:100%;
margin:auto;
background:white;
padding:12mm;
box-sizing:border-box;
box-shadow:0 0 10px rgba(0,0,0,0.25);
}

h2,h3{text-align:center;margin:6px 0 10px 0;}

input,button,textarea{
width:100%;
padding:8px;
margin:4px 0;
box-sizing:border-box;
font-size:14px;
}

button{
background:#28a745;
color:white;
border:none;
cursor:pointer;
border-radius:5px;
}

.dateWrap{position:relative;}
.datePicker{
position:absolute;
left:0;
top:4px;
width:100%;
height:36px;
opacity:0;
z-index:2;
cursor:pointer;
}

.tableWrap{width:100%;overflow:visible;margin-top:10px;}

table{
width:100%;
border-collapse:collapse;
table-layout:fixed;
text-align:center;
font-size:12px;
}

td,th{
border:1px solid #000;
padding:5px 3px;
word-break:break-word;
vertical-align:middle;
box-sizing:border-box;
}

th{background:#eee;}

.actionBtn{
width:24px !important;
height:22px;
padding:0 !important;
margin:0 1px;
font-size:10px;
}

.noteTable{width:100%;table-layout:fixed;}

.noteTable th:nth-child(1),
.noteTable td:nth-child(1){
width:calc(100% - 58px);
text-align:left;
word-break:break-word;
}

.noteTable th:nth-child(2),
.noteTable td:nth-child(2){
width:58px;
min-width:58px;
max-width:58px;
white-space:nowrap;
padding:2px;
text-align:center;
}

.noteTable .actionBtn{
width:24px !important;
height:22px;
font-size:10px;
padding:0 !important;
margin:0;
}

.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
justify-content:center;
align-items:center;
z-index:999;
}

.popup-box{
background:white;
padding:15px;
border-radius:10px;
width:90%;
max-width:400px;
}

.redBtn{background:red;}
.blueBtn{background:#007bff;}

@media(max-width:700px){
body{padding:5px;}
.box{width:100%;min-height:auto;padding:10px;box-shadow:none;}
table{font-size:10px;}
td,th{padding:4px 2px;}
.actionBtn{width:22px !important;height:20px;font-size:9px;}
.noteTable th:nth-child(2),
.noteTable td:nth-child(2){
width:52px;
min-width:52px;
max-width:52px;
}
}

@media print{
@page{size:A4;margin:8mm;}

body{background:white;padding:0;margin:0;}

.box{
width:100%;
min-height:auto;
max-width:100%;
margin:0;
padding:0;
box-shadow:none;
background:white;
}

h2{display:block;font-size:18px;margin-bottom:8px;}

h3,input,textarea,button,.popup,.datePicker{
display:none !important;
}

.tableWrap{overflow:visible !important;margin:0 0 12px 0;}

table{
width:100% !important;
border-collapse:collapse;
table-layout:fixed;
font-size:11px;
}

thead{display:table-header-group;}

tr{
page-break-inside:avoid;
page-break-after:auto;
}

th,td{
border:1px solid #000;
padding:4px 2px;
color:black;
word-break:break-word;
}

th:last-child,
td:last-child{
display:none !important;
}
}
</style>
</head>

<body>

<div class="box">

<h2>झारकिला लेबर</h2>

<div class="dateWrap">
<input id="date" placeholder="दिनांक" readonly>
<input id="datePicker" class="datePicker" type="date">
</div>

<input id="n1" placeholder="नाम 1">
<input id="n2" placeholder="नाम 2">
<input id="n3" placeholder="नाम 3">
<input id="n4" placeholder="नाम 4">
<input id="n5" placeholder="नाम 5">
<input id="n6" placeholder="नाम 6">

<textarea id="noteInput" placeholder="नोट"></textarea>

<button id="saveBtn" onclick="saveData()">💾 Save</button>
<button onclick="printData()">🖨️ Print</button>

<div class="tableWrap">
<table>
<thead>
<tr>
<th>दिनांक</th>
<th>1</th>
<th>2</th>
<th>3</th>
<th>4</th>
<th>5</th>
<th>6</th>
<th>Action</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<h3>📝 Notes Table</h3>

<div class="tableWrap">
<table class="noteTable">
<thead>
<tr>
<th>नोट</th>
<th>Action</th>
</tr>
</thead>
<tbody id="noteBody"></tbody>
</table>
</div>

</div>

<div class="popup" id="editPopup">
<div class="popup-box">
<h3>Edit</h3>

<div class="dateWrap">
<input id="e_date" placeholder="दिनांक" readonly>
<input id="e_datePicker" class="datePicker" type="date">
</div>

<input id="e1" placeholder="नाम 1">
<input id="e2" placeholder="नाम 2">
<input id="e3" placeholder="नाम 3">
<input id="e4" placeholder="नाम 4">
<input id="e5" placeholder="नाम 5">
<input id="e6" placeholder="नाम 6">

<button id="updateBtn" onclick="updateData()">Update</button>
<button class="redBtn" onclick="closePopup()">Cancel</button>
</div>
</div>

<div class="popup" id="notePopup">
<div class="popup-box">
<h3>Edit Note</h3>
<textarea id="editNote" placeholder="नोट"></textarea>
<button id="noteUpdateBtn" onclick="updateNote()">Update</button>
<button class="redBtn" onclick="closeNotePopup()">Cancel</button>
</div>
</div>

<div class="popup" id="deletePopup">
<div class="popup-box">
<h3>Delete करना है?</h3>
<p>क्या आप इस data को delete करना चाहते हैं?</p>
<button class="redBtn" onclick="confirmDelete()">🗑️ Delete</button>
<button class="blueBtn" onclick="closeDeletePopup()">Cancel</button>
</div>
</div>

<script type="module">
import {
db,
collection,
addDoc,
onSnapshot,
deleteDoc,
doc,
updateDoc,
getDoc
} from "./firebase.js";

let editId=null;
let noteEditId=null;
let deleteId=null;
let deleteType="";

function isoToDDMMYYYY(iso){
if(!iso) return "";
let p=iso.split("-");
return p[2]+"-"+p[1]+"-"+p[0];
}

function ddmmyyyyToISO(dateStr){
if(!dateStr) return "";
let p=dateStr.split("-");
if(p.length!==3) return "";
return p[2]+"-"+p[1].padStart(2,"0")+"-"+p[0].padStart(2,"0");
}

datePicker.addEventListener("change",function(){
date.value=isoToDDMMYYYY(this.value);
});

e_datePicker.addEventListener("change",function(){
e_date.value=isoToDDMMYYYY(this.value);
});

function buttonText(btn,newText,oldText){
btn.innerText=newText;
setTimeout(()=>{btn.innerText=oldText;},1200);
}

function sortDate(d){
let p=(d||"").split("-");
if(p.length!==3) return 99999999;

let dd=p[0].padStart(2,"0");
let mm=p[1].padStart(2,"0");
let yy=p[2];

if(yy.length===2){yy="20"+yy;}

return Number(yy+mm+dd);
}

window.saveData=async()=>{
let note=noteInput.value.trim();

if(!date.value && !note){
buttonText(saveBtn,"दिनांक या नोट डालो","💾 Save");
return;
}

if(date.value){
await addDoc(collection(db,"jharkila"),{
date:date.value,
n1:n1.value,
n2:n2.value,
n3:n3.value,
n4:n4.value,
n5:n5.value,
n6:n6.value,
time:Date.now()
});
}

if(note){
await addDoc(collection(db,"jharkila_note"),{
text:note,
time:Date.now()
});
}

date.value="";
datePicker.value="";
n1.value="";
n2.value="";
n3.value="";
n4.value="";
n5.value="";
n6.value="";
noteInput.value="";

buttonText(saveBtn,"✅ Saved","💾 Save");
};

onSnapshot(collection(db,"jharkila"),snap=>{
tbody.innerHTML="";

let arr=[];

snap.forEach(d=>{
let x=d.data();

arr.push({
id:d.id,
date:x.date||"",
n1:x.n1||"",
n2:x.n2||"",
n3:x.n3||"",
n4:x.n4||"",
n5:x.n5||"",
n6:x.n6||"",
time:x.time||0
});
});

arr.sort((a,b)=>{
let da=sortDate(a.date);
let db=sortDate(b.date);
if(da===db){return a.time-b.time;}
return da-db;
});

arr.forEach(x=>{
tbody.innerHTML+=`
<tr>
<td>${x.date}</td>
<td>${x.n1}</td>
<td>${x.n2}</td>
<td>${x.n3}</td>
<td>${x.n4}</td>
<td>${x.n5}</td>
<td>${x.n6}</td>
<td>
<button class="actionBtn" onclick="editData('${x.id}')">✏️</button>
<button class="actionBtn" onclick="openDeletePopup('${x.id}','main')">🗑️</button>
</td>
</tr>`;
});
});

onSnapshot(collection(db,"jharkila_note"),snap=>{
noteBody.innerHTML="";

let arr=[];

snap.forEach(d=>{
let n=d.data();

arr.push({
id:d.id,
text:n.text||"",
time:n.time||0
});
});

arr.sort((a,b)=>a.time-b.time);

arr.forEach(n=>{
noteBody.innerHTML+=`
<tr>
<td class="noteText">${n.text}</td>
<td>
<button class="actionBtn" onclick="editNoteData('${n.id}')">✏️</button>
<button class="actionBtn" onclick="openDeletePopup('${n.id}','note')">🗑️</button>
</td>
</tr>`;
});
});

window.openDeletePopup=(id,type)=>{
deleteId=id;
deleteType=type;
deletePopup.style.display="flex";
};

window.closeDeletePopup=()=>{
deleteId=null;
deleteType="";
deletePopup.style.display="none";
};

window.confirmDelete=async()=>{
if(!deleteId) return;

if(deleteType==="main"){
await deleteDoc(doc(db,"jharkila",deleteId));
}else{
await deleteDoc(doc(db,"jharkila_note",deleteId));
}

closeDeletePopup();
};

window.editData=async(id)=>{
let snap=await getDoc(doc(db,"jharkila",id));

if(!snap.exists()) return;

let x=snap.data();

e_date.value=x.date||"";
e_datePicker.value=ddmmyyyyToISO(x.date||"");
e1.value=x.n1||"";
e2.value=x.n2||"";
e3.value=x.n3||"";
e4.value=x.n4||"";
e5.value=x.n5||"";
e6.value=x.n6||"";

editId=id;
editPopup.style.display="flex";
};

window.updateData=async()=>{
if(!editId){
buttonText(updateBtn,"पहले Edit चुनो","Update");
return;
}

await updateDoc(doc(db,"jharkila",editId),{
date:e_date.value,
n1:e1.value,
n2:e2.value,
n3:e3.value,
n4:e4.value,
n5:e5.value,
n6:e6.value
});

buttonText(updateBtn,"Updated","Update");

setTimeout(()=>{
closePopup();
},500);
};

window.closePopup=()=>{
editPopup.style.display="none";
editId=null;
};

window.editNoteData=async(id)=>{
let snap=await getDoc(doc(db,"jharkila_note",id));

if(!snap.exists()) return;

let n=snap.data();

editNote.value=n.text||"";
noteEditId=id;
notePopup.style.display="flex";
};

window.updateNote=async()=>{
if(!noteEditId){
buttonText(noteUpdateBtn,"पहले Edit चुनो","Update");
return;
}

await updateDoc(doc(db,"jharkila_note",noteEditId),{
text:editNote.value
});

buttonText(noteUpdateBtn,"Updated","Update");

setTimeout(()=>{
closeNotePopup();
},500);
};

window.closeNotePopup=()=>{
notePopup.style.display="none";
noteEditId=null;
};

window.printData=()=>window.print();
</script>

<script src="pwa.js"></script>

<script>
/* AUTO BACK TO ADMIN PASSWORD */
(function(){
  history.pushState(null, "", location.href);

  window.addEventListener("popstate", function(){
    localStorage.removeItem("login");
    location.replace("index.html"); 
  });
})();
</script>

</body>
</html>
