<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jharkila Labour</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#28a745">
<link rel="icon" href="icon-192.png">

<style>
body{
font-family:Arial;
background:#dcdde1;
padding:15px;
margin:0;
}

.box{
width:210mm;
min-height:297mm;
margin:auto;
background:white;
padding:12mm;
box-sizing:border-box;
box-shadow:0 0 10px rgba(0,0,0,0.25);
}

/* INPUT */
input,button,textarea{
width:100%;
padding:8px;
margin:4px 0;
box-sizing:border-box;
font-size:14px;
}

button{
background:#28a745;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

/* TABLE */
.tableWrap{
width:100%;
overflow:visible;
margin-top:10px;
}

.mainTable{
width:100%;
border-collapse:collapse;
table-layout:fixed;
font-size:12px;
}

td,th{
border:1px solid #000;
padding:5px 3px;
word-break:break-word;
text-align:center;
}

/* 🔥 DATE FIX */
.mainTable th:nth-child(1),
.mainTable td:nth-child(1){
width:85px;
white-space:nowrap;
font-size:11px;
}

/* 🔥 ACTION FIX */
.mainTable th:nth-child(8),
.mainTable td:nth-child(8){
width:58px;
white-space:nowrap;
}

/* BUTTON */
.actionBtn{
width:24px !important;
height:22px;
font-size:10px;
padding:0;
margin:1px;
}

/* 🔥 NOTES TABLE FIX */
.noteTable{
width:100%;
border-collapse:collapse;
table-layout:fixed;
font-size:12px;
}

.noteTable th:nth-child(1),
.noteTable td:nth-child(1){
width:calc(100% - 58px);
text-align:left;
}

.noteTable th:nth-child(2),
.noteTable td:nth-child(2){
width:58px;
white-space:nowrap;
}

.noteTable .actionBtn{
width:24px !important;
height:22px;
}

/* PRINT */
@media print{
@page{size:A4;margin:8mm;}

body{background:white;padding:0;margin:0;}

.box{
width:100%;
padding:0;
box-shadow:none;
}

input,textarea,button{display:none;}

thead{display:table-header-group;}
tr{page-break-inside:avoid;}

th:last-child,td:last-child{display:none;}
}
</style>
</head>

<body>

<div class="box">

<h2>झारकिला लेबर</h2>

<input id="date" placeholder="दिनांक">
<input id="n1" placeholder="नाम 1">
<input id="n2" placeholder="नाम 2">
<input id="n3" placeholder="नाम 3">
<input id="n4" placeholder="नाम 4">
<input id="n5" placeholder="नाम 5">
<input id="n6" placeholder="नाम 6">

<textarea id="noteInput" placeholder="नोट"></textarea>

<button onclick="saveData()">Save</button>
<button onclick="printData()">Print</button>

<div class="tableWrap">
<table class="mainTable">
<thead>
<tr>
<th>दिनांक</th>
<th>1</th>
<th>2</th>
<th>3</th>
<th>4</th>
<th>5</th>
<th>6</th>
<th>Action</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<h3>Notes</h3>

<div class="tableWrap">
<table class="noteTable">
<thead>
<tr>
<th>नोट</th>
<th>Action</th>
</tr>
</thead>
<tbody id="noteBody"></tbody>
</table>
</div>

</div>

<script type="module">
import {
db,
collection,
addDoc,
onSnapshot,
deleteDoc,
doc,
updateDoc,
getDoc
} from "./firebase.js";

let editId=null;
let noteEditId=null;

/* SAVE */
window.saveData=async()=>{
if(date.value){
await addDoc(collection(db,"jharkila"),{
date:date.value,
n1:n1.value,
n2:n2.value,
n3:n3.value,
n4:n4.value,
n5:n5.value,
n6:n6.value
});
}

if(noteInput.value){
await addDoc(collection(db,"jharkila_note"),{
text:noteInput.value
});
}

alert("Saved");

date.value="";
n1.value="";
n2.value="";
n3.value="";
n4.value="";
n5.value="";
n6.value="";
noteInput.value="";
};

/* TABLE */
onSnapshot(collection(db,"jharkila"),snap=>{
tbody.innerHTML="";
snap.forEach(d=>{
let x=d.data();
tbody.innerHTML+=`
<tr>
<td>${x.date||""}</td>
<td>${x.n1||""}</td>
<td>${x.n2||""}</td>
<td>${x.n3||""}</td>
<td>${x.n4||""}</td>
<td>${x.n5||""}</td>
<td>${x.n6||""}</td>
<td>
<button class="actionBtn" onclick="deleteData('${d.id}')">🗑️</button>
</td>
</tr>`;
});
});

/* NOTES */
onSnapshot(collection(db,"jharkila_note"),snap=>{
noteBody.innerHTML="";
snap.forEach(d=>{
let n=d.data();
noteBody.innerHTML+=`
<tr>
<td>${n.text}</td>
<td>
<button class="actionBtn" onclick="deleteNote('${d.id}')">🗑️</button>
</td>
</tr>`;
});
});

window.deleteData=async(id)=>{
await deleteDoc(doc(db,"jharkila",id));
}

window.deleteNote=async(id)=>{
await deleteDoc(doc(db,"jharkila_note",id));
}

window.printData=()=>window.print();
</script>

</body>
</html>
