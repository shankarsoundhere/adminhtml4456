<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>बकाया लिस्ट</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#28a745">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
body{font-family:Arial;background:#f1f3f6;padding:10px;}
.box{max-width:1000px;margin:auto;background:white;padding:15px;border-radius:10px;}
input,button{width:100%;padding:10px;margin:5px 0;box-sizing:border-box;font-size:16px;}
button{background:#28a745;color:white;border:none;border-radius:5px;cursor:pointer;}

#phone2,#e_phone2{display:none;}

.dateWrap{position:relative;}
#datePicker,#e_datePicker{
position:absolute;left:0;top:5px;width:100%;height:42px;
opacity:0;z-index:2;cursor:pointer;
}

.card{background:#f1f2f6;padding:8px 10px;border-radius:12px;margin-top:8px;box-shadow:0 2px 6px rgba(0,0,0,0.1);}
.top{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px;}
.tag{background:#dfe4ea;padding:3px 8px;border-radius:8px;font-size:13px;font-weight:bold;}
.amount{font-size:14px;margin:4px 0 6px;word-break:break-word;}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;}
.person{font-size:14px;display:flex;align-items:center;gap:6px;}
.phoneText{font-size:12px;color:#555;margin-top:2px;}
.icon{font-size:18px;}

.callBox{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
.call{background:#28c34a;color:white;padding:5px 12px;border-radius:16px;font-size:13px;font-weight:bold;text-decoration:none;}

.action{display:flex;gap:4px;margin-top:6px;}
.action button{padding:5px 8px;font-size:12px;}

.popup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:999;}
.popup-box{background:white;padding:15px;border-radius:10px;width:90%;max-width:400px;}
.redBtn{background:red;}
.blueBtn{background:#007bff;}

@media print{
input,button,.action,.popup,#datePicker,#e_datePicker{display:none !important;}
body{background:white;padding:0;}
.box{max-width:100%;margin:0;padding:10px;box-shadow:none;}
.card{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid;}
h2{text-align:center;margin:0 0 10px 0;}
.callBox{display:flex !important;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
.call{display:inline-block !important;}
}
</style>
</head>

<body>

<!-- LOGIN PROTECTION -->
<script>
if(sessionStorage.getItem("login") !== "true"){
  location.replace("index.html");
}
</script>

<div class="box">

<h2>बकाया</h2>

<div class="dateWrap">
<input id="date" placeholder="दिनांक" readonly>
<input id="datePicker" type="date">
</div>

<input id="work" placeholder="काम">
<input id="place" placeholder="जगह">
<input id="amount" placeholder="बकाया राशि">
<input id="name" placeholder="नाम">
<input id="phone1" placeholder="मोबाइल नंबर">
<input id="phone2" placeholder="मोबाइल नंबर">

<button id="saveBtn" onclick="saveData()">💾 Save</button>
<button onclick="printData()">🖨️ Print</button>

<div id="list"></div>

</div>

<!-- POPUPS SAME -->
<div class="popup" id="editPopup">
<div class="popup-box">
<h3>Edit Data</h3>

<div class="dateWrap">
<input id="e_date" placeholder="दिनांक" readonly>
<input id="e_datePicker" type="date">
</div>

<input id="e_work">
<input id="e_place">
<input id="e_amount">
<input id="e_name">
<input id="e_phone1">
<input id="e_phone2">

<button id="updateBtn" onclick="updateData()">✅ Update</button>
<button class="redBtn" onclick="closePopup()">❌ Cancel</button>

</div>
</div>

<div class="popup" id="deletePopup">
<div class="popup-box">
<h3>Delete करना है?</h3>
<button class="redBtn" onclick="confirmDelete()">🗑️ Delete</button>
<button class="blueBtn" onclick="closeDeletePopup()">Cancel</button>
</div>
</div>

<script type="module">
import {db,collection,addDoc,onSnapshot,deleteDoc,doc,updateDoc,getDoc} from "./firebase.js";

const colRef = collection(db,"bakaya");
let editId=null,deleteId=null;
const $=(id)=>document.getElementById(id);

window.saveData=async()=>{
let data={
date:$("date").value,work:$("work").value,place:$("place").value,
amount:$("amount").value,name:$("name").value,
phone1:$("phone1").value,phone2:$("phone2").value,time:Date.now()
};
await addDoc(colRef,data);
};

onSnapshot(colRef,snap=>{
let html="";
snap.forEach(d=>{
let x=d.data();
html+=`<div class="card">
<div>${x.name||"-"} - ${x.amount||"-"}</div>
</div>`;
});
$("list").innerHTML=html;
});
</script>

<script src="pwa.js"></script>

<!-- BACK BUTTON CONTROL -->
<script>
history.pushState(null,"",location.href);
window.addEventListener("popstate",function(){
sessionStorage.removeItem("login");
location.replace("index.html");
});
</script>

</body>
</html>
