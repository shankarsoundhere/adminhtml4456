<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>बकाया लिस्ट</title>

<!-- ✅ PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#28a745">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
body{font-family:Arial;background:#f1f3f6;padding:10px;}
.box{max-width:1000px;margin:auto;background:white;padding:15px;border-radius:10px;}
input,button{width:100%;padding:10px;margin:5px 0;box-sizing:border-box;font-size:16px;}
button{background:#28a745;color:white;border:none;border-radius:5px;cursor:pointer;}
.msg{display:none;background:#000;color:#fff;padding:6px;text-align:center;border-radius:5px;margin-bottom:8px;}

.card{background:#f1f2f6;padding:8px 10px;border-radius:12px;margin-top:8px;box-shadow:0 2px 6px rgba(0,0,0,0.1);}
.top{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px;}
.tag{background:#dfe4ea;padding:3px 8px;border-radius:8px;font-size:13px;font-weight:bold;}
.amount{font-size:14px;margin:4px 0 6px;word-break:break-word;}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;}
.person{font-size:14px;display:flex;align-items:center;gap:6px;}
.phoneText{font-size:12px;color:#555;margin-top:2px;}
.icon{font-size:18px;}
.call{background:#28c34a;color:white;padding:5px 12px;border-radius:16px;font-size:13px;font-weight:bold;text-decoration:none;}
.action{display:flex;gap:4px;margin-top:6px;}
.action button{padding:5px 8px;font-size:12px;}

.popup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:999;}
.popup-box{background:white;padding:15px;border-radius:10px;width:90%;max-width:400px;}

@media print{
input,button,.action,.msg,.popup{display:none !important;}
body{background:white;padding:0;}
.box{max-width:100%;margin:0;padding:10px;box-shadow:none;}
.card{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid;}
h2{text-align:center;margin:0 0 10px 0;}
}
</style>
</head>

<body>

<div class="box">

<h2>💰 बकाया लिस्ट</h2>

<div id="msg" class="msg"></div>

<input id="date" placeholder="दिनांक">
<input id="work" placeholder="काम">
<input id="place" placeholder="जगह">
<input id="amount" placeholder="बकाया राशि">
<input id="name" placeholder="नाम">
<input id="phone" placeholder="मोबाइल नंबर">

<button onclick="saveData()">💾 Save</button>
<button onclick="printData()">🖨️ Print</button>

<div id="list"></div>

</div>

<div class="popup" id="editPopup">
<div class="popup-box">

<h3>Edit Data</h3>

<input id="e_date">
<input id="e_work">
<input id="e_place">
<input id="e_amount">
<input id="e_name">
<input id="e_phone">

<button onclick="updateData()">✅ Update</button>
<button onclick="closePopup()">❌ Cancel</button>

</div>
</div>

<script type="module">

import {
db,
collection,
addDoc,
onSnapshot,
deleteDoc,
doc,
updateDoc,
getDoc
} from "./firebase.js";

const colRef = collection(db,"bakaya");
let editId=null;

const $ = (id)=>document.getElementById(id);

function showMsg(t){
$("msg").innerText=t;
$("msg").style.display="block";
setTimeout(()=>{$("msg").style.display="none"},1500);
}

function clearForm(){
["date","work","place","amount","name","phone"].forEach(id=>$(id).value="");
}

window.saveData=async()=>{
let data={
date:$("date").value.trim(),
work:$("work").value.trim(),
place:$("place").value.trim(),
amount:$("amount").value.trim(),
name:$("name").value.trim(),
phone:$("phone").value.trim()
};

if(!data.name && !data.amount){
alert("नाम या राशि डालो");
return;
}

await addDoc(colRef,data);
showMsg("Saved");
clearForm();
}

onSnapshot(colRef,snap=>{
let html="";
snap.forEach(d=>{
let x=d.data();

html+=`
<div class="card">

<div class="top">
<span class="tag">${x.date||"-"}</span>
<span class="tag">${x.work||"-"}</span>
<span class="tag">${x.place||"-"}</span>
</div>

<div class="amount">${x.amount||"-"}</div>

<div class="row">
<div class="person">
<span class="icon">👤</span>
<div>
<div>${x.name||"-"}</div>
<div class="phoneText">${x.phone||"-"}</div>
</div>
</div>

<a class="call" href="tel:${x.phone||""}">📞 Call</a>
</div>

<div class="action">
<button onclick="editData('${d.id}')">✏️</button>
<button onclick="deleteData('${d.id}')">🗑️</button>
</div>

</div>
`;
});

$("list").innerHTML=html;
});

window.deleteData=async(id)=>{
if(confirm("Delete करना है?")){
await deleteDoc(doc(db,"bakaya",id));
showMsg("Deleted");
}
}

window.editData=async(id)=>{
let snap = await getDoc(doc(db,"bakaya",id));

if(!snap.exists()){
alert("Data नहीं मिला");
return;
}

let x=snap.data();

$("e_date").value=x.date||"";
$("e_work").value=x.work||"";
$("e_place").value=x.place||"";
$("e_amount").value=x.amount||"";
$("e_name").value=x.name||"";
$("e_phone").value=x.phone||"";

editId=id;
$("editPopup").style.display="flex";
}

window.updateData=async()=>{
await updateDoc(doc(db,"bakaya",editId),{
date:$("e_date").value.trim(),
work:$("e_work").value.trim(),
place:$("e_place").value.trim(),
amount:$("e_amount").value.trim(),
name:$("e_name").value.trim(),
phone:$("e_phone").value.trim()
});

$("editPopup").style.display="none";
editId=null;
showMsg("Updated");
}

window.closePopup=()=>{
$("editPopup").style.display="none";
editId=null;
}

window.printData=()=>window.print();

</script>

<!-- ✅ PWA SCRIPT -->
<script src="pwa.js"></script>

</body>
</html>
